# gitleaks configuration for Orkeon
#
# Extends the bundled default ruleset and allowlists the reviewed false positives
# BY VALUE — never by path.
#
# Why that matters, demonstrated rather than asserted (2026-09-05): this file used to
# allowlist eight paths. A well-formed, high-entropy `ghp_...` token planted in one of
# them was NOT reported, while the identical token in any other file was. A path entry
# does not silence the finding that was triaged; it silences every future finding in that
# file, including a real credential committed by accident years later. The eight paths are
# gone. Each of the values below was read in its source before being listed, and the files
# holding them are scanned like every other file in the repository.
#
# Adding an entry here is a triage decision, not a way to make CI green. If a new match is
# a real credential, it gets rotated and purged from the history — it does not get listed.

title = "Orkeon gitleaks config"

# Inherit gitleaks' default rules instead of redefining them.
[extend]
useDefault = true

# ── Fixture and documentation values ─────────────────────────────────────────────────
#
# All of these are deliberately fake, and most of them exist precisely so a test can prove
# that Orkeon DETECTS or REDACTS a credential-shaped string:
#
#   sk-abc123xyz4567890abcdefghij     LogSanitizerTests — the strings the sanitizer must
#   sk-abcdefghij1234567890abcdef     scrub out of LLM exchange logs. Also used by
#   0123456789abcdef0123456789abcdef  LlmLoggingDelegatingHandlerTests for the same reason.
#   abcdefgh1234567890xyz
#   sk-test-key-1234567890            the API key the three ImageGenerationTool test files
#                                     wire into a fake HTTP handler.
#   tvly-test-api-key-12345           the same, for WebSearchTool (Tavily).
#   sk-abcdef1234567890               TeamCatalogTests writes credential-shaped fixtures
#   totally-a-secret-1234             into temp files and asserts the team catalogue
#   ${ORKEON_Llm__ApiKey}             refuses them; the third is the literal placeholder
#                                     used as that test's clean case.
#   sk-test1234567890abcdef           EnvironmentSecretProviderTests sets it into an env
#                                     var to prove the provider reads it back.
#   orkeon-encryption-key-v2          documentation of ProvisionNewKeyAsync(store, NAME).
#                                     A key *name*, not a key — not a credential at all.
#   sk-live-0123456789                the API key ProviderBalanceTests (Studio.Wpf.Tests) and
#                                     HttpProviderBalanceProbeTests (Studio.Core.Tests) hand
#                                     to a fake HTTP handler, to assert the Bearer header.
#   03-finance-trading                not a credential at all: the examples category of that
#                                     name (examples/03-finance-trading/). It fires only after
#                                     a property called `Key` — `chip.Key == "..."` in
#                                     ModalStops and the use-case wizard tests.
#   sk-from-the-variable-0123456789   the key RunnerHostApiKeyReferenceTests sets into a
#                                     throw-away environment variable, to prove the host reads
#                                     ApiKeyEnvVar and never prints the key in its startup lines.
#   zai-secret-key-1234               the key HttpLlmEndpointProbeTests (Studio.Core.Tests)
#                                     hands its fake Z.AI handler, to assert what the probe
#                                     sends and that its diagnostic never prints it.
#   GOCSPX=secret                     what EmailValidationTests (Studio.Core.Tests) writes where a
#                                     variable NAME is expected (`Auth:ClientSecretEnvVar`), to prove
#                                     Studio warns that it is no variable name and never repeats
#                                     what was typed. Six letters of Google's prefix, `=`, a word.
[[allowlists]]
description = "Reviewed fake fixture and documentation values (listed individually, never by path)"
regexes = [
  '''^"?sk-abc123xyz4567890abcdefghij"?$''',
  '''^"?sk-abcdefghij1234567890abcdef"?$''',
  '''^"?0123456789abcdef0123456789abcdef"?$''',
  '''^"?abcdefgh1234567890xyz"?$''',
  '''^"?sk-test-key-1234567890"?$''',
  '''^"?tvly-test-api-key-12345"?$''',
  '''^"?sk-abcdef1234567890"?$''',
  '''^"?totally-a-secret-1234"?$''',
  '''^"?\$\{ORKEON_Llm__ApiKey\}"?$''',
  '''^"?sk-test1234567890abcdef"?$''',
  '''^"?orkeon-encryption-key-v2"?$''',
  '''^"?sk-live-0123456789"?$''',
  '''^"?03-finance-trading"?$''',
  '''^"?sk-from-the-variable-0123456789"?$''',
  '''^"?zai-secret-key-1234"?$''',
  '''^"?GOCSPX=secret"?$''',
]

# ── A credential that is a variable, not a value ─────────────────────────────────────
#
# The `curl-auth-user` default rule fires on `curl -u <value>`. Every such call in this
# repository passes a shell variable: `curl -sf -u "$SONAR_TOKEN:" ...` in
# scripts/sonar-analyze.sh. The secret gitleaks extracts is the literal text
# `"$SONAR_TOKEN:"`, so this pattern says one thing only — what was matched is a variable
# being expanded, not a value. Verified: a real token pasted at the same spot still fires.
#
# Deliberately NOT scoped with `targetRules = ["curl-auth-user"]`: on gitleaks 8.28.0 a
# targetRules-scoped [[allowlists]] entry is not applied to rules inherited from the
# default set (with it, the six findings still fire; without it, they clear). The lost
# scoping costs nothing here — no rule of any kind should report a bare `$VARIABLE`.
[[allowlists]]
description = "A credential that is a shell-variable expansion, never a literal"
regexes = ['''^"?\$\{?[A-Za-z_][A-Za-z0-9_]*\}?:?"?$''']
