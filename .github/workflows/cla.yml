# Contributor License Agreement gate (see CLA.md -- a template awaiting counsel's
# validation; this workflow documents and enforces the intended process).
#
# On every pull request from an account that has not accepted CLA.md, the action posts
# a comment asking for one exact sentence and reports a failing check until it is
# posted. Signatures live on the `cla-signatures` branch of THIS repository (no
# external service, no PAT: the workflow's own token writes them) and cover every
# later pull request from the same account. The maintainer account and dependabot
# are allowlisted.
#
# pull_request_target on purpose: it runs with this repository's token on the base
# branch's workflow file, which is what lets the action comment on and write for a
# fork's pull request. The action checks out nothing from the fork.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Orkeon/orkeon/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'arion-orkeon,dependabot[bot],dependabot'
          create-file-commit-message: 'chore(cla): create the signatures file'
          signed-commit-message: 'chore(cla): $contributorName has signed the CLA in #$pullRequestNo'
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be reviewed, please read [CLA.md](https://github.com/Orkeon/orkeon/blob/main/CLA.md) and, if you agree, post the sentence below as a comment on this pull request. One signature per GitHub account, once.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Every contributor of this pull request has signed the CLA.'
          lock-pullrequest-aftermerge: false
