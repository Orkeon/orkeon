# Builds the release artefacts on a v* tag, smokes them on a real Windows and a
# real Ubuntu runner, and only then attaches them to the GitHub Release.
# Coexists with publish.yml (NuGet push) on the same trigger.
#
# Pipeline: installers -> {smoke-windows, smoke-deb, smoke-macos, msi} -> release.
# The smokes (and the msi job's own install/uninstall smoke) install from the
# *job* artefacts, never from the Release, so a broken payload is caught before
# anything is published. workflow_dispatch runs everything except the
# publication (no tag, no Release to attach to).
#
# A single ubuntu runner cross-publishes every RID: framework-dependent publish
# compiles nothing native (apphosts ship in the SDK packs, natives come from
# NuGet runtimes/), and esbuild is fetched per-RID from the npm registry. The
# tree-sitter pruning is an MSBuild target, so it applies to the cross-published
# win-x64 payload exactly as it does to linux-x64.
name: Release installers
on:
  push: { tags: [ 'v*' ] }
  workflow_dispatch:
# Least privilege: the workflow default is read-only; `installers` elevates
# actions: write for the artifact prune above its steps, and `release` elevates
# contents: write to publish the GitHub Release. Smoke/msi jobs run repo scripts
# and get no write scope at all.
permissions: { contents: read }
jobs:
  installers:
    runs-on: ubuntu-latest
    # actions: write — prunes this workflow's leftover courier artifacts (see the
    # prune step) before uploading ~1 GB of new ones.
    permissions: { contents: read, actions: write }
    steps:
      - name: Free up runner disk space
        run: |
          echo "Avant:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Après:"; df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      # Every artifact this workflow uploads is a 1-day courier between jobs,
      # but GitHub recalculates storage only every 6-12 h — leftovers from a
      # couple of back-to-back runs can hit the account quota and fail the
      # upload steps outright (observed live). Delete this workflow's previous
      # courier artifacts up front; anything older than 2 h cannot belong to a
      # run that is still consuming it. The name filter keeps other workflows'
      # artifacts alive — rag-eval.yml publishes 3-day report bundles that an
      # unfiltered prune used to delete before their retention expired.
      - name: Prune leftover workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.expired == false and .created_at < \"$cutoff\") | select(.name | test(\"^(orkeon-|release-assets$)\")) | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null \
                && echo "deleted stale artifact $id"
            done

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # On a tag the version is the tag minus its leading v. On workflow_dispatch
      # there is no tag to read, so --version is omitted and the packaging scripts
      # fall back to their own resolution (git describe, then Directory.Build.props).
      - name: Resolve the packaging arguments
        id: pkg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version_arg=--version ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version_arg=" >> "$GITHUB_OUTPUT"
          fi

      # --keep-stage linux-x64: the per-RID staging trees are by-products (the
      # archives above them are the artifacts) and the five of the full set weigh
      # ~2.6 GB on a runner that already has to free disk before it can start.
      # Exactly one of them has a second consumer — the Debian step below reads
      # the linux-x64 tree through package-deb.sh --stage rather than publishing
      # it again — so that one is named and the other four go as soon as their
      # archive is written.
      - name: Package installers (every app, every RID)
        run: ./scripts/package-installers.sh ${{ steps.pkg.outputs.version_arg }} --out artifacts/installers --keep-stage linux-x64

      # The desktop onboarding channels: the `orkeon` CLI alone, as
      # orkeon-cli-<ver>-win-x64.zip and orkeon-cli-<ver>-osx-{arm64,x64}.tar.gz.
      # Same --out, so the SHA256SUMS regenerated at the end of this call covers
      # the multi-app archives too. The osx payloads are cross-published from this
      # ubuntu runner like every other RID.
      # No --keep-stage here: these three trees are kept (the default), and no
      # later step in this job reads them — the msi job harvests the *zip*, not a
      # staging tree. They are the next lever if the runner ever runs short again.
      - name: Package the CLI archives (win-x64, osx-arm64, osx-x64)
        run: ./scripts/package-installers.sh --app-set cli --rids "win-x64 osx-arm64 osx-x64" ${{ steps.pkg.outputs.version_arg }} --out artifacts/installers

      # package-deb.sh only lifts libexec/orkeon + libexec/esbuild-bin out of a
      # staging tree, and the multi-app linux-x64 staging already holds both from
      # the same self-contained, pruned publish. Reusing it saves a second publish
      # (~3 min and a couple of GB) for a byte-identical payload.
      - name: Package the Debian package (amd64)
        run: |
          mapfile -t stages < <(find artifacts/installers/_stage -mindepth 1 -maxdepth 1 -type d \
            -name 'orkeon-*-linux-x64' ! -name 'orkeon-cli-*')
          if [[ ${#stages[@]} -ne 1 ]]; then
            echo "Expected exactly one linux-x64 staging tree, found ${#stages[@]}: ${stages[*]}" >&2
            exit 1
          fi
          ./scripts/package-deb.sh --stage "${stages[0]}" --out artifacts/installers

      - name: List the artefacts
        run: ls -lh artifacts/installers/*.tar.gz artifacts/installers/*.zip artifacts/installers/*.deb artifacts/installers/SHA256SUMS

      # One artefact per smoke plus a complement for the release: each smoke
      # pulls only what it needs (a few hundred MB), and every archive is
      # uploaded exactly ONCE — release-assets excludes what the per-smoke
      # artifacts already carry, and the release job reassembles the full set
      # from all four. Duplicating the smoke payloads into release-assets used
      # to double ~700 MB of storage per run, which is what tipped the account
      # quota. compression-level 0 everywhere — .zip/.tar.gz/.deb are already
      # compressed, so the default level 6 only burns CPU on both ends. They
      # exist to carry payloads between jobs of this one run, hence the
      # one-day retention.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orkeon-cli-win-x64
          path: artifacts/installers/orkeon-cli-*-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orkeon-cli-osx
          path: artifacts/installers/orkeon-cli-*-osx-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      # Both linux payloads the smoke-deb job installs: the .deb, and the
      # multi-app linux-x64 tarball. The tarball rides along because it is the
      # only published archive that carries the two Studio TUIs on a runner we
      # actually have — smoke-macos exercises run-smoke-tarball.sh with
      # `--studio absent`, and nothing exercised the `present` side.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orkeon-linux
          path: |
            artifacts/installers/*.deb
            artifacts/installers/orkeon-*-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      # The complement only: the cli win zip lives in orkeon-cli-win-x64, the
      # cli osx tarballs in orkeon-cli-osx, and the .deb + the full linux-x64
      # tarball in orkeon-linux. What remains here: the full win zip, the full
      # osx tarballs, the full linux-arm64 tarball and the checksums. (The
      # linux-x64 exclusion pattern would also match a cli linux tarball, but
      # this workflow never builds one — the cli step targets win + osx only.)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            artifacts/installers/*.tar.gz
            artifacts/installers/*.zip
            artifacts/installers/SHA256SUMS
            !artifacts/installers/orkeon-cli-*-win-x64.zip
            !artifacts/installers/orkeon-cli-*-osx-*.tar.gz
            !artifacts/installers/orkeon-*-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Installs the published Windows archive on a real Windows runner and walks the
  # onboarding chain on it (WIN-06). Exercises WIN-01 through WIN-05 end to end,
  # plus the Orkeon Studio payload and its `--smoke-exit` start/close smoke
  # (STUDIO-08) — this job is the only place a WPF window is ever opened, so a
  # Studio that fails to resolve its XAML or its runtime surfaces here.
  smoke-windows:
    runs-on: windows-latest
    needs: installers
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orkeon-cli-win-x64
          path: artifacts
      # -WorkDir pins the scratch directory to a known, uploadable path (the
      # runner itself is torn down at the end of the job, so anything left
      # only under the default temp folder's auto-generated name is
      # unreachable afterwards) and -Keep keeps its logs\ subfolder around on
      # a pass too, not just on failure (run-smoke.ps1's own default), so the
      # upload-artifact step below always has something to attach.
      - name: Smoke the installed CLI
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts -Filter 'orkeon-cli-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No orkeon-cli-*-win-x64.zip in the downloaded artefact.' }
          ./scripts/smoke-onboarding/run-smoke.ps1 -ArchivePath $zip.FullName -WorkDir "${{ runner.temp }}/orkeon-smoke" -Keep
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: orkeon-smoke-windows-logs
          path: ${{ runner.temp }}/orkeon-smoke/logs
          if-no-files-found: ignore
          retention-days: 1

  # Builds the per-user MSI (WIN-07) from the same CLI zip artefact
  # smoke-windows uses, then runs its own install / orkeon doctor / uninstall
  # smoke. A separate job rather than folding into smoke-windows: it needs the
  # zip *as a wix harvest source* (extracted, not just installed) plus the wix
  # toolchain, and a wix authoring regression should not be indistinguishable
  # from a ZIP-channel regression in the job list.
  msi:
    runs-on: windows-latest
    needs: installers
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orkeon-cli-win-x64
          path: artifacts

      # build-msi.ps1 harvests a tree whose root directly contains bin\ and
      # libexec\ (see its -StageDir doc) -- the zip's own top-level folder, not
      # the raw Expand-Archive destination. Same unwrap run-smoke.ps1 does.
      - name: Extract the CLI zip as the wix harvest source
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts -Filter 'orkeon-cli-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No orkeon-cli-*-win-x64.zip in the downloaded artefact.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath artifacts\_extract -Force
          $roots = @(Get-ChildItem artifacts\_extract -Directory)
          if ($roots.Count -ne 1) { throw "Expected exactly one top-level folder in the archive, found $($roots.Count)." }
          "STAGE_DIR=$($roots[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the MSI
        shell: pwsh
        run: ./scripts/build-msi.ps1 -StageDir "$env:STAGE_DIR" -OutDir artifacts\installers

      - name: List the MSI
        shell: pwsh
        run: Get-ChildItem artifacts\installers\*.msi, artifacts\installers\SHA256SUMS.msi | Format-Table -AutoSize

      # Install -> orkeon doctor (liveness + no failing check) -> uninstall,
      # with the same msiexec exit-code tolerance (0 or 3010 = pending reboot,
      # both are a successful install/uninstall) run-smoke.ps1 documents for
      # the ZIP channel's own quirks. PATH is not reloaded in this session, so
      # the installed orkeon.cmd is called by its full path throughout.
      - name: Smoke — install, orkeon doctor, Orkeon Studio, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem artifacts\installers -Filter 'orkeon-*-win-x64.msi' | Select-Object -First 1).FullName
          if (-not $msi) { throw 'No orkeon-*-win-x64.msi produced.' }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Orkeon'
          $orkeonCmd = Join-Path $installDir 'bin\orkeon.cmd'
          $arpKeyPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $logsDir = 'artifacts\msi-logs'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null

          function Get-UserPathRaw {
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $false)
            if (-not $key) { return '' }
            try {
              $raw = $key.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              if ($null -eq $raw) { return '' }
              return [string]$raw
            } finally { $key.Close() }
          }

          Write-Host "==> msiexec /i $msi /qn"
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/l*v', "$logsDir\install.log") -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Get-Content "$logsDir\install.log" -Tail 60; throw "msiexec /i exited $($p.ExitCode)" }

          if (-not (Test-Path -LiteralPath $orkeonCmd)) { throw "$orkeonCmd not found after install" }
          Write-Host "PASS install -- $orkeonCmd exists"

          # Per-user MSI registration lands under the HKCU Uninstall key, but an
          # elevated CI session may surprise us -- search both hives (plus the
          # 32-bit view), retry once for registry settle, and dump everything the
          # runner actually sees before failing, so a red run is self-diagnosing.
          function Find-OrkeonArpEntry {
            $roots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )
            foreach ($root in $roots) {
              $hit = Get-ItemProperty -Path "$root\*" -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -eq 'Orkeon' } | Select-Object -First 1
              if ($hit) { return [pscustomobject]@{ Root = $root; Entry = $hit } }
            }
            return $null
          }
          $found = Find-OrkeonArpEntry
          if (-not $found) { Start-Sleep -Seconds 3; $found = Find-OrkeonArpEntry }
          if (-not $found) {
            Write-Host '--- ARP dump (both hives) ---'
            foreach ($root in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                                'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall')) {
              Write-Host "[$root]"
              Get-ChildItem $root -ErrorAction SilentlyContinue | ForEach-Object {
                $p = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
                Write-Host ("  {0}  DisplayName='{1}'" -f $_.PSChildName, $p.DisplayName)
              }
            }
            throw 'No Add/Remove Programs entry named Orkeon after install.'
          }
          if ($found.Root -notlike 'HKCU:*') {
            Write-Warning "ARP entry registered under $($found.Root) (expected HKCU for a per-user package -- elevated session side effect?)"
          }
          Write-Host "PASS arp -- registered in $($found.Root) (DisplayVersion $($found.Entry.DisplayVersion))"

          $userPathEntries = @((Get-UserPathRaw) -split ';' | Where-Object { $_ })
          if ($userPathEntries -notcontains (Join-Path $installDir 'bin')) { throw "$(Join-Path $installDir 'bin') not on the user PATH after install." }
          Write-Host 'PASS path -- bin\ added to the user PATH'

          # Orkeon Studio (STUDIO-08, spec §8.4). Same assertions the ZIP channel
          # runs in run-smoke.ps1 -- shared from lib\studio-windows.ps1 so the two
          # channels cannot drift -- plus the Start-menu shortcut, which is the
          # MSI's own addition (Package.wxs StudioShortcutComponent) and exists in
          # no other channel.
          . ./scripts/smoke-onboarding/lib/studio-windows.ps1
          $studio = Invoke-OrkeonStudioWindowsSmoke -InstallRoot $installDir -LogDir $logsDir -ExpectStartMenuShortcut
          foreach ($note in $studio.Notes) { Write-Host "     $note" }
          if ($studio.Problems.Count -gt 0) { throw ("Orkeon Studio: " + ($studio.Problems -join '; ')) }
          Write-Host 'PASS studio -- launcher + WPF apphost installed, Start-menu shortcut present, --smoke-exit returned 0'

          # Windows PowerShell 5.1 raises NativeCommandError on any stderr output
          # under a `2>` redirection while $ErrorActionPreference is 'Stop' --
          # same caveat run-smoke.ps1's Invoke-Orkeon documents. Relax it only
          # around this one native call.
          $previousEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $doctorOut = & $orkeonCmd doctor --json 2>"$logsDir\doctor.err.txt"
          $doctorExit = $LASTEXITCODE
          $ErrorActionPreference = $previousEap
          if ($doctorExit -gt 1) { Get-Content "$logsDir\doctor.err.txt"; throw "orkeon doctor exited $doctorExit (expected 0 or 1)" }
          $results = @($doctorOut | ConvertFrom-Json)
          $fails = @($results | Where-Object { $_.status -eq 'fail' })
          if ($fails.Count -gt 0) { $doctorOut; throw "orkeon doctor reported $($fails.Count) failing check(s)" }
          Write-Host "PASS doctor -- $($results.Count) checks, no failure"

          Write-Host "==> msiexec /x $msi /qn"
          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/l*v', "$logsDir\uninstall.log") -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Get-Content "$logsDir\uninstall.log" -Tail 60; throw "msiexec /x exited $($p.ExitCode)" }

          # Only the payload itself is asserted strictly: RemoveFolder in
          # Package.wxs is wired to INSTALLFOLDER alone, and each <Files>
          # -harvested subfolder (bin\, libexec\, libexec\orkeon\,
          # libexec\esbuild-bin\) otherwise relies on Windows Installer's own
          # per-component directory cleanup -- not guaranteed for an
          # intermediate folder holding only subfolders and no file of its
          # own (libexec\ is exactly that case). A leftover empty shell under
          # $installDir is cosmetic, not a broken uninstall.
          if ((Test-Path -LiteralPath $orkeonCmd) -or (Test-Path -LiteralPath (Join-Path $installDir 'libexec\orkeon'))) {
            throw "Uninstall left payload behind under $installDir (orkeon.cmd and/or libexec\orkeon still present)"
          }
          Write-Host 'PASS uninstall -- orkeon.cmd and libexec\orkeon removed'
          if (Test-Path -LiteralPath $installDir) {
            Write-Warning "$installDir still exists after uninstall (payload is gone -- see above; an empty leftover directory tree is not asserted as a failure)."
          } else {
            Write-Host 'PASS uninstall -- install dir fully removed'
          }

          $arpEntryAfter = Find-OrkeonArpEntry
          if ($arpEntryAfter) { throw "Add/Remove Programs entry still present after uninstall (in $($arpEntryAfter.Root))." }
          Write-Host 'PASS arp-removed -- entry gone from every hive'

          $userPathEntriesAfter = @((Get-UserPathRaw) -split ';' | Where-Object { $_ })
          if ($userPathEntriesAfter -contains (Join-Path $installDir 'bin')) { throw "$(Join-Path $installDir 'bin') still on the user PATH after uninstall." }
          Write-Host 'PASS path-removed -- bin\ entry gone'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: orkeon-msi-logs
          path: artifacts/msi-logs
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orkeon-msi
          path: |
            artifacts/installers/*.msi
            artifacts/installers/SHA256SUMS.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The two Linux channels, on one stock ubuntu image.
  #
  # First the .deb: installed through apt, walked along the same onboarding chain
  # as every other channel, then removed (LIN-02). It asserts the two Orkeon
  # Studio TUIs the package carries — /usr/bin/orkeon-studio-{config,run} present,
  # and both answering `--version` with stdin and stdout redirected, the headless
  # contract of STUDIO-08.
  #
  # Then the tar.gz channel, which is where `--studio present` gets its only run:
  # smoke-macos is the sole other caller of run-smoke-tarball.sh and it passes
  # `--studio absent`, so until this step the "installed from an archive, and
  # working headless" half of STUDIO-08 was asserted nowhere.
  smoke-deb:
    runs-on: ubuntu-latest
    needs: installers
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orkeon-linux
          path: artifacts
      - name: Smoke the installed package
        run: |
          deb="$(find artifacts -maxdepth 1 -name 'orkeon_*_amd64.deb' | head -n1)"
          if [[ -z "$deb" ]]; then
            echo "No orkeon_*_amd64.deb in the downloaded artefact." >&2
            exit 1
          fi
          ./scripts/smoke-onboarding/run-smoke-deb.sh --deb "$deb"

      # --prefix keeps this install off /usr entirely, so it cannot collide with
      # the .deb the step above installed and removed — the two channels stay
      # independent even if that removal ever regresses. --studio present is
      # spelled out rather than left to the script's `auto` deduction, for the
      # same reason smoke-macos spells out `absent`: the assertion this step
      # exists to make must not be able to degrade into "nothing to check".
      # --work-dir / --keep pin the scratch tree to an uploadable path and hold
      # its logs/ on a pass too, not just on failure.
      - name: Smoke the linux tarball (Studio TUIs present)
        run: |
          tarball="$(find artifacts -maxdepth 1 -name 'orkeon-*-linux-x64.tar.gz' | head -n1)"
          if [[ -z "$tarball" ]]; then
            echo "No orkeon-*-linux-x64.tar.gz in the downloaded artefact." >&2
            exit 1
          fi
          ./scripts/smoke-onboarding/run-smoke-tarball.sh \
            --tarball "$tarball" \
            --studio present \
            --prefix "$RUNNER_TEMP/orkeon-tarball" \
            --work-dir "$RUNNER_TEMP/orkeon-smoke-tarball" \
            --keep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: orkeon-smoke-linux-tarball-logs
          path: ${{ runner.temp }}/orkeon-smoke-tarball/logs
          if-no-files-found: ignore
          retention-days: 1

  # Installs the published osx-arm64 tarball on a real Apple-silicon runner and
  # walks the same chain, then uninstalls (MAC-02). This is also the only place
  # the Gatekeeper / code-signing story gets exercised: an unsigned, quarantined
  # or malformed native library (libtree-sitter*.dylib, onnxruntime, the esbuild
  # binary) kills the process at load time, so doctor / run / rag fail here
  # rather than in a user's terminal.
  smoke-macos:
    runs-on: macos-latest
    needs: installers
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orkeon-cli-osx
          path: artifacts
      # --work-dir pins the scratch tree to a known, uploadable path and --keep
      # holds it on a pass too (the script's own default only keeps it on
      # failure), so the upload step below always has something to attach.
      #
      # --studio absent is the anti-regression guard of STUDIO-07's RID filter:
      # V1 ships no Orkeon Studio on macOS, so anything named orkeon-studio* in
      # this archive — or in the tree install.sh lays down from it — fails the
      # job. Spelled out rather than left to the script's `auto` deduction: this
      # is the assertion the macOS channel exists to make, and it must not be
      # able to degrade into "nothing to check" if the archives are ever renamed.
      - name: Smoke the installed CLI
        run: |
          tarball="$(find artifacts -maxdepth 1 -name 'orkeon-cli-*-osx-arm64.tar.gz' | head -n1)"
          if [[ -z "$tarball" ]]; then
            echo "No orkeon-cli-*-osx-arm64.tar.gz in the downloaded artefact." >&2
            exit 1
          fi
          ./scripts/smoke-onboarding/run-smoke-tarball.sh \
            --tarball "$tarball" \
            --studio absent \
            --work-dir "$RUNNER_TEMP/orkeon-smoke" \
            --keep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: orkeon-smoke-macos-logs
          path: ${{ runner.temp }}/orkeon-smoke/logs
          if-no-files-found: ignore
          retention-days: 1

  # Publication is gated on every smoke (incl. the msi job's own install/
  # uninstall smoke): nothing reaches the Release until it has been installed
  # and run on the target OS. Tag-only — a workflow_dispatch run has no
  # Release to attach to, and skipping this job is the expected outcome.
  #
  # Two checksum files rather than one merged SHA256SUMS: the ubuntu
  # `installers` job generates SHA256SUMS before the MSI exists (it's built
  # later, on windows-latest, in the `msi` job) — recomputing a single file
  # would mean either a second ubuntu pass after the fact or a
  # download-modify-reupload dance here. A separate SHA256SUMS.msi asset,
  # uploaded by `msi` itself, is the simpler, more robust option: each
  # checksum file is generated by the job that actually produced the
  # artefact it covers.
  release:
    runs-on: ubuntu-latest
    needs: [ installers, smoke-windows, smoke-deb, smoke-macos, msi ]
    if: startsWith(github.ref, 'refs/tags/')
    # contents: write — publishes the GitHub Release and its assets.
    permissions: { contents: write }
    steps:
      # Reassemble the full artefact set: release-assets is the complement,
      # the three per-smoke artifacts carry the rest (each archive was
      # uploaded exactly once — see the installers job).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: artifacts/installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orkeon-cli-win-x64
          path: artifacts/installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orkeon-cli-osx
          path: artifacts/installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orkeon-linux
          path: artifacts/installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orkeon-msi
          path: artifacts/installers
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/installers/*.tar.gz
            artifacts/installers/*.zip
            artifacts/installers/*.deb
            artifacts/installers/*.msi
            artifacts/installers/SHA256SUMS
            artifacts/installers/SHA256SUMS.msi
          # The curated notes are the CHANGELOG section matching this tag; the
          # auto-generated commit list below is the appendix, not the story.
          body: |
            **Curated release notes**: see the section matching this tag in
            [CHANGELOG.md](https://github.com/Orkeon/orkeon/blob/${{ github.ref_name }}/CHANGELOG.md).
          generate_release_notes: true

  # Builds and pushes the example-runners container image to GHCR. Same v* trigger
  # as the installers; runs independently (own job, package-scoped permissions).
  # Tag-only: a workflow_dispatch run would otherwise push a `latest` tag built
  # from a branch, with a version resolved from a ref that is not a version.
  runners-image:
    runs-on: ubuntu-latest
    # Gated on the smokes like the release job: a red smoke must not move the
    # :latest tag on GHCR either.
    needs: [smoke-windows, smoke-deb, smoke-macos, msi]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          echo "Avant:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Après:"; df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve version tag (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push orkeon-runners image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.runners
          push: true
          tags: |
            ghcr.io/orkeon/orkeon-runners:${{ steps.ver.outputs.version }}
            ghcr.io/orkeon/orkeon-runners:latest
