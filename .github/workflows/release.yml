# Builds per-OS installer archives on a v* tag and attaches them to the GitHub
# Release. Coexists with publish.yml (NuGet push) on the same trigger.
#
# A single ubuntu runner cross-publishes every RID: framework-dependent publish
# compiles nothing native (apphosts ship in the SDK packs, natives come from
# NuGet runtimes/), and esbuild is fetched per-RID from the npm registry.
name: Release installers
on: { push: { tags: [ 'v*' ] } }
permissions: { contents: write }
jobs:
  installers:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          echo "Avant:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Après:"; df -h / | tail -1
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Package installers
        run: ./scripts/package-installers.sh --version "${GITHUB_REF_NAME#v}" --out artifacts/installers
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installers/*.tar.gz
            artifacts/installers/*.zip
            artifacts/installers/SHA256SUMS
          generate_release_notes: true

  # Builds and pushes the example-runners container image to GHCR. Same v* trigger
  # as the installers; runs independently (own job, package-scoped permissions).
  runners-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          echo "Avant:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Après:"; df -h / | tail -1
      - uses: actions/checkout@v4
      - name: Resolve version tag (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push orkeon-runners image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runners
          push: true
          tags: |
            ghcr.io/orkeon/orkeon-runners:${{ steps.ver.outputs.version }}
            ghcr.io/orkeon/orkeon-runners:latest
