# Publishes NuGet packages on a v* tag: every packable to GitHub Packages (the
# internal tooling feed), plus the consolidated v1 public set to NuGet.org (PUB-25):
# the `Orkeon` umbrella, `Orkeon.Tools`, and the opt-ins — per
# docs/reference/publication-matrix.md. Between two tags, the `publish-dev` job
# keeps the latest main installable from GitHub Packages (see the end of this header).
#
# NuGet.org auth is Trusted Publishing (OIDC): a nuget.org policy for
# Orkeon/orkeon + publish.yml exchanges this job's OIDC token for a short-lived
# API key (NuGet/login) — no long-lived secret. The steps no-op with a warning
# until the NUGET_USER repository variable (the nuget.org profile that owns the
# policy) is configured (owner action).
#
# The tag must match the version in src/Directory.Build.props, or the run fails
# before packing. Lesson from the 0.9.1-beta incident: the v0.9.1-beta.rc* tags
# re-packed the unchanged props version and `--skip-duplicate` silently skipped
# every push — an entire "release" published nothing. `--skip-duplicate` stays
# (idempotent re-runs of the SAME tag are wanted); the guard removes the silent
# tag/version drift it used to mask.
#
# Hosted runners only have ~14 GB free disk; this repo's native deps need more, so
# the first step frees ~20 GB. The test phase runs unit + fast tests only — it
# EXCLUDES Category=Integration (Testcontainers DB tests that pull GBs of DB images
# and caused "No space left on device") and Category=Slow, the latter carrying the
# Embeddings.Local tests that boot the real ONNX model; those run in a step of their
# own so a native-runtime failure names itself.
# `dotnet test` drives Microsoft.Testing.Platform (global.json), not VSTest — see
# ci.yml's header for what that changes about filters and flags.
#
# Dev channel (job `publish-dev`): once CI is green on a push to main, the same
# packables are packed as `<props version>.dev.<CI run number>` and pushed to GitHub
# Packages ONLY — never NuGet.org, which cannot delete a version, only unlist it.
# scripts/prune-dev-packages.sh then deletes the older dev builds, so the feed holds
# the tagged releases plus the latest main and nothing in between. Tagged versions
# are never touched. No tests (CI just ran them on this very commit), no attestation
# or SBOM: a dev build is not a release.
name: Publish packages
on:
  push: { tags: [ 'v*' ] }
  workflow_run: { workflows: [ CI ], types: [ completed ], branches: [ main ] }
# id-token is required by the NuGet.org Trusted Publishing OIDC exchange.
permissions: { contents: read, packages: write, id-token: write }
jobs:
  publish:
    if: github.event_name == 'push'
    # Restated at job scope so that attestations: write is granted here and
    # nowhere else. The three others are what the workflow default already
    # carries: contents to read the tree, packages to push to GitHub Packages,
    # id-token for the NuGet Trusted Publishing OIDC exchange — which the
    # provenance signing below reuses rather than asking for a second time.
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    runs-on: ubuntu-latest
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      # Two seconds instead of eighteen minutes. The provenance attestation below
      # needs a public repository (or a paid plan for a private one), and it sits
      # after build, test and pack — so on a private repo this job spends the whole
      # cycle doing perfectly good work and then dies at the one step it cannot pass,
      # having published nothing. Fail here instead, and say what to do about it.
      #
      # The LIVE value, not github.event.repository.private: an event payload is
      # frozen the moment the event fires, so a run created while the repository was
      # private would keep failing here on every re-run, long after the flip — the
      # guard would outlive the condition it guards. The API is the only thing that
      # answers "is it public now".
      - name: Attestation needs a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" != "true" ]; then exit 0; fi
          echo "::error::The repository is private. actions/attest-build-provenance requires a public repository or a paid plan, and it runs before either push — so nothing would be published even if every other step passed. Make the repository public (backstage PUB-26 §2), then re-run this workflow or re-push the tag."
          exit 1
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # Anti-0.9.1 guard: the tag decides nothing — the packed version comes from
      # src/Directory.Build.props, so a tag that doesn't match it would re-pack an
      # existing version and --skip-duplicate would "publish" nothing, silently.
      - name: Verify tag matches Directory.Build.props version
        run: |
          prefix=$(sed -n 's/.*<VersionPrefix>\(.*\)<\/VersionPrefix>.*/\1/p' src/Directory.Build.props)
          suffix=$(sed -n 's/.*<VersionSuffix>\(.*\)<\/VersionSuffix>.*/\1/p' src/Directory.Build.props)
          version="$prefix${suffix:+-$suffix}"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match src/Directory.Build.props version $version — bump the props (and CHANGELOG) before tagging. See the 0.9.1-beta incident in CHANGELOG."
            exit 1
          fi
          echo "Tag v$tag matches props version $version."
      # LOT K: the other two release steps CONTRIBUTING asks for, made mechanical —
      # the CHANGELOG's [Unreleased] section must be cut into a dated version section,
      # and no PublicAPI.Unshipped.txt may still declare an API. Both were pure
      # discipline until now, and discipline is what produced the 0.9.1-beta incident
      # the guard above exists for. Runnable locally: python3 scripts/check-release-readiness.py
      - name: Verify the release checklist (CHANGELOG cut, PublicAPI shipped)
        run: python3 scripts/check-release-readiness.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore Orkeon.sln
      - run: dotnet build Orkeon.sln -c Release --no-restore
      # Unit + fast tests only, same split as ci.yml (which documents it in full):
      # Microsoft.Testing.Platform via global.json, no by-name project exclusion —
      # a filter matching zero tests in a module is an error there, not a no-op.
      - run: dotnet test Orkeon.sln -c Release --no-build --filter "Category!=Integration&Category!=Slow"
      # The ONNX tests of Embeddings.Local, alone, so a native-runtime failure names
      # itself and blocks the release. The exit-139 tolerance this step used to carry
      # is gone with its cause: the crash was a call into a disposed native session,
      # not an ONNX teardown artefact (see ci.yml's step for the full account).
      - run: dotnet test tests/tools/Orkeon.Tools.Embeddings.Local.Tests/Orkeon.Tools.Embeddings.Local.Tests.csproj -c Release --no-build --filter "Category=Integration|Category=Slow"
      - run: dotnet pack  Orkeon.sln -c Release -o artifacts /p:ContinuousIntegrationBuild=true
      # Package-closure gate (PUB-25): the public lineup must be restorable (no Orkeon.*
      # dependency outside the lineup — the rc.1/rc.2 NU1101 incident), and the umbrella
      # packages' hand-declared external dependencies must match their embedded projects.
      - name: Check package closure
        run: python3 scripts/check-package-closure.py --artifacts artifacts --lineup Orkeon Orkeon.Tools Orkeon.Rag.Onnx Orkeon.Rag.Onnx.Model Orkeon.Tools.Embeddings.Local Orkeon.Scripting.Cli Orkeon.Compliance.Vfs Orkeon.Interop.AgentFramework Orkeon.Hosting.Aspire
      # Software bill of materials (CycloneDX 1.7 JSON) of the whole solution as
      # packed: every NuGet dependency, transitive included, read from the
      # project.assets.json files the pack just produced. The tool is a pinned
      # dotnet tool, not a third-party action. Generated before the attestation so
      # the same statement covers it, and kept as a run artefact — nuget.org has no
      # slot for an SBOM; release.yml attaches the same document to the Release.
      - name: Generate the SBOM
        run: |
          dotnet tool install --tool-path .tools CycloneDX --version 6.2.0
          .tools/dotnet-CycloneDX Orkeon.sln -o artifacts -fn "orkeon-${GITHUB_REF_NAME#v}.sbom.cdx.json" -F Json -t -sn Orkeon -sv "${GITHUB_REF_NAME#v}"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(f\"{len(d.get('components', []))} components\")" "artifacts/orkeon-${GITHUB_REF_NAME#v}.sbom.cdx.json"
      # Build provenance for the packages and the SBOM: generated once the nupkgs
      # exist and the closure gate has cleared them, and before the first push sends
      # them anywhere — so both feeds receive bytes an attestation already covers.
      # Whoever downloads a package verifies it as docs/guides/verify-what-you-install.md
      # describes (a nuget.org download must shed its repository signature first —
      # scripts/nupkg-unsign.py — because nuget.org rewrites the archive):
      #   gh attestation verify Orkeon.1.0.0-rc.3.unsigned.nupkg --repo Orkeon/orkeon
      # NuGet.org shows nothing of this; the attestation lives in this repository,
      # and it is what turns "the package claims to be Orkeon" into "GitHub Actions
      # built it from this commit of Orkeon/orkeon".
      - name: Attest the packages and the SBOM (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: artifacts/*.sbom.cdx.json
          if-no-files-found: error
      - run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/Orkeon/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
      # NuGet.org — the public v1 set only (docs/reference/publication-matrix.md):
      # the `Orkeon` umbrella (the whole framework in one package), `Orkeon.Tools`,
      # and the three opt-ins. Expanding this list is a maintainer decision recorded
      # in the matrix, not a workflow edit made in passing. Keep it in sync with the
      # closure-gate lineup above.
      - name: Warn when NuGet.org publishing is not configured
        if: env.NUGET_USER == ''
        run: echo "::warning::NuGet.org publish SKIPPED — the NUGET_USER repository variable is not set. Owner action -- on nuget.org create a Trusted Publishing policy (repo Orkeon/orkeon, workflow publish.yml), then set NUGET_USER to the policy's package owner (Settings > Secrets and variables > Actions > Variables)."
      - name: NuGet.org login (Trusted Publishing — OIDC, short-lived key)
        if: env.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ env.NUGET_USER }}
      - name: Push the v1 lineup to NuGet.org
        if: env.NUGET_USER != ''
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # `Orkeon` FIRST: the other lineup packages depend on it, and NuGet does not
          # order pushes for us — pushing a dependent before its dependency would expose
          # a package whose restore fails (the rc.1/rc.2 incident).
          #
          # The [0-9] keeps `Orkeon.*.nupkg` from swallowing Orkeon.Tools & co: it anchors
          # the match to the version segment. THE SHELL must expand it, not the CLI —
          # `dotnet nuget push` resolves its own wildcards through NuGet's PathResolver,
          # which knows `*` and `?` and nothing else. A quoted `[0-9]` reached it as a
          # literal and it answered `File does not exist (artifacts/Orkeon.[0-9]*.nupkg)`
          # while the file sat right there. The GitHub Packages push above never met this:
          # `artifacts/*.nupkg` is inside that dialect. So: unquoted glob, bash expands it,
          # and the CLI is handed a real path.
          for id in Orkeon Orkeon.Tools Orkeon.Rag.Onnx Orkeon.Rag.Onnx.Model Orkeon.Tools.Embeddings.Local Orkeon.Scripting.Cli Orkeon.Compliance.Vfs Orkeon.Interop.AgentFramework Orkeon.Hosting.Aspire; do
            # No nullglob: an unmatched pattern stays literal, so test the first element
            # rather than trust the count — a missing package must stop the release, not
            # be pushed as a filename.
            matches=(artifacts/${id}.[0-9]*.nupkg)
            if [ ! -e "${matches[0]}" ]; then
              echo "::error::No package matched artifacts/${id}.<version>.nupkg — dotnet pack did not produce it, or the lineup and the packaging projects have drifted apart."
              exit 1
            fi
            # One path per invocation: the CLI takes a single root argument.
            for pkg in "${matches[@]}"; do
              dotnet nuget push "$pkg" \
                --source "https://api.nuget.org/v3/index.json" \
                --api-key "$NUGET_API_KEY" --skip-duplicate
            done
          done

  publish-dev:
    # Only a push to main whose CI passed, in this repository. workflow_run also fires
    # for pull-request runs, and a fork's branch may well be called main: the event and
    # the head repository are what rule those out, not the branch filter above.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    # packages: write covers the push and the prune's deletions.
    permissions: { contents: read, packages: write }
    # No concurrency group, on purpose. The version carries the CI run number, which
    # follows push order, and the prune only deletes LOWER numbers, so two runs that
    # overlap cannot roll the channel back: the newer one wins. A group would let a
    # late run (a re-run of an old CI run, say) cancel or replace a newer one mid-push.
    runs-on: ubuntu-latest
    env:
      CI_RUN: ${{ github.event.workflow_run.run_number }}
    steps:
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1
      # The commit CI validated, not whatever main points to by now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # <prefix>-<suffix>.dev.<n> sorts ABOVE <prefix>-<suffix> (SemVer: on equal
      # leading identifiers the longer prerelease wins) and below the next suffix, so
      # after 1.0.0-rc.4 the channel serves 1.0.0-rc.4.dev.<n> to `--prerelease`.
      # A props version without a suffix is a stable one, released or about to be:
      # <prefix>-dev.<n> would sort BELOW it and the channel would silently serve the
      # release instead, so the dev builds move to the next patch (1.0.1-dev.<n>).
      # scripts/resolve-version.sh holds that rule, for this job and for the apt dev channel
      # (apt-dev.yml): one CI run, one version, whatever the package.
      - name: Resolve the dev version
        id: ver
        run: |
          version=$(bash scripts/resolve-version.sh --props src/Directory.Build.props --run "$CI_RUN")
          { echo "prefix=${version%%-*}"; echo "suffix=${version#*-}"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          echo "Dev version: $version (CI run #$CI_RUN)"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      # One pack, restore and build included. ContinuousIntegrationBuild must reach the
      # build, not only the pack: it is what maps the source paths in the PDBs.
      - name: Pack
        env:
          PREFIX: ${{ steps.ver.outputs.prefix }}
          SUFFIX: ${{ steps.ver.outputs.suffix }}
        run: dotnet pack Orkeon.sln -c Release -o artifacts "/p:VersionPrefix=$PREFIX" "/p:VersionSuffix=$SUFFIX" /p:ContinuousIntegrationBuild=true
      # The tag job's gate, on the canonical lineup (the script's LINEUP default): no
      # third hand-written copy of the list for check-doc-claims.py to miss.
      - name: Check package closure
        run: python3 scripts/check-package-closure.py --artifacts artifacts
      # The version must reach the dependencies between the packages too: a dev
      # Orkeon.Tools declaring `Orkeon >= <props version>` would restore the last
      # released Orkeon under it, silently mixing two builds.
      - name: Check the Orkeon dependencies name the dev version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          stale=$(for f in artifacts/*.nupkg; do
                    unzip -p "$f" '*.nuspec' | grep -o '<dependency id="Orkeon[^"]*" version="[^"]*"' \
                      | grep -vF "version=\"$VERSION\"" | sed "s|^|${f##*/}: |"
                  done || true)
          if [ -n "$stale" ]; then
            echo "::error::Orkeon dependencies not on $VERSION:"; echo "$stale"; exit 1
          fi
          echo "Every Orkeon dependency names $VERSION."
      # --skip-duplicate for re-runs: re-running this workflow, or the CI run behind it,
      # packs the same version again, and must not trip over what the first attempt pushed.
      - run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/Orkeon/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
      # After the push, never before: a prune followed by a failed push would leave the
      # channel empty. --artifacts limits it to the packages this run has just pushed.
      - name: Prune older dev versions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/prune-dev-packages.sh --keep "$VERSION" --artifacts artifacts --apply
