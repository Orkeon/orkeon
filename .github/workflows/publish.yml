# Publishes NuGet packages on a v* tag: every packable to GitHub Packages (the
# experiments/ feed), plus the three core libraries to NuGet.org — the v1 public set
# per docs/reference/publication-matrix.md.
#
# NuGet.org auth is Trusted Publishing (OIDC): a nuget.org policy for
# Orkeon/orkeon + publish.yml exchanges this job's OIDC token for a short-lived
# API key (NuGet/login) — no long-lived secret. The steps no-op with a warning
# until the NUGET_USER repository variable (the nuget.org profile that owns the
# policy) is configured (owner action).
#
# The tag must match the version in src/Directory.Build.props, or the run fails
# before packing. Lesson from the 0.9.1-beta incident: the v0.9.1-beta.rc* tags
# re-packed the unchanged props version and `--skip-duplicate` silently skipped
# every push — an entire "release" published nothing. `--skip-duplicate` stays
# (idempotent re-runs of the SAME tag are wanted); the guard removes the silent
# tag/version drift it used to mask.
#
# Hosted runners only have ~14 GB free disk; this repo's native deps need more, so
# the first step frees ~20 GB. The test phase runs unit + fast tests only — it
# EXCLUDES Category=Integration (Testcontainers DB tests that pull GBs of DB images
# and caused "No space left on device") and Category=Slow, the latter carrying the 8
# Embeddings.Local tests whose native ONNX runtime crashes the process after they pass
# (exit 139); those run in a step of their own that tolerates that one shape.
# `dotnet test` drives Microsoft.Testing.Platform (global.json), not VSTest — see
# ci.yml's header for what that changes about filters and flags.
name: Publish packages
on: { push: { tags: [ 'v*' ] } }
# id-token is required by the NuGet.org Trusted Publishing OIDC exchange.
permissions: { contents: write, packages: write, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Free up runner disk space
        run: |
          echo "Avant:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Après:"; df -h / | tail -1
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Anti-0.9.1 guard: the tag decides nothing — the packed version comes from
      # src/Directory.Build.props, so a tag that doesn't match it would re-pack an
      # existing version and --skip-duplicate would "publish" nothing, silently.
      - name: Verify tag matches Directory.Build.props version
        run: |
          prefix=$(sed -n 's/.*<VersionPrefix>\(.*\)<\/VersionPrefix>.*/\1/p' src/Directory.Build.props)
          suffix=$(sed -n 's/.*<VersionSuffix>\(.*\)<\/VersionSuffix>.*/\1/p' src/Directory.Build.props)
          version="$prefix${suffix:+-$suffix}"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match src/Directory.Build.props version $version — bump the props (and CHANGELOG) before tagging. See the 0.9.1-beta incident in CHANGELOG."
            exit 1
          fi
          echo "Tag v$tag matches props version $version."
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore Orkeon.sln
      - run: dotnet build Orkeon.sln -c Release --no-restore
      # Unit + fast tests only, same split as ci.yml (which documents it in full):
      # Microsoft.Testing.Platform via global.json, no by-name project exclusion —
      # a filter matching zero tests in a module is an error there, not a no-op.
      - run: dotnet test Orkeon.sln -c Release --no-build --filter "Category!=Integration&Category!=Slow"
      # The 8 ONNX tests of Embeddings.Local, alone: they pass and the native runtime
      # then crashes the process (exit 139). Only that shape is tolerated — every
      # discovered test accounted for, none failed — so a real failure still blocks the
      # release (PUB-17 T3, same guard as ci.yml).
      - name: Test Embeddings.Local ONNX suite (tolerate the crash only after green results)
        run: |
          set +e
          out="$(dotnet test tests/tools/Orkeon.Tools.Embeddings.Local.Tests/Orkeon.Tools.Embeddings.Local.Tests.csproj -c Release --no-build --filter "Category=Integration|Category=Slow" 2>&1)"
          rc=$?
          echo "$out"
          if [ $rc -eq 0 ]; then exit 0; fi
          field() { printf '%s\n' "$out" | sed -n "s/^[[:space:]]*$1:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p" | tail -1; }
          total=$(field total); failed=$(field failed); ok=$(field succeeded); skipped=$(field skipped)
          : "${total:=0}"; : "${failed:=-1}"; : "${ok:=0}"; : "${skipped:=0}"
          if { [ "$rc" -eq 139 ] || printf '%s\n' "$out" | grep -q "Exit code: 139"; } \
             && [ "$total" -gt 0 ] && [ "$failed" -eq 0 ] && [ "$((ok + skipped))" -eq "$total" ]; then
            echo "::warning::Embeddings.Local: $ok/$total ONNX tests passed; native-runtime crash at exit 139 tolerated (known issue, PUB-17/SONAR-14)."
            exit 0
          fi
          echo "::error::Embeddings.Local run failed (exit $rc, $failed failed, $ok/$total accounted for) — not the known post-green ONNX crash. Release blocked."
          exit $rc
      - run: dotnet pack  Orkeon.sln -c Release -o artifacts /p:ContinuousIntegrationBuild=true
      # Orkeon.Runners.Shared already lives inside Orkeon.sln, so the pack above emits it too;
      # this second pack is a harmless safety net (push uses --skip-duplicate).
      - run: dotnet pack  examples/runners/_shared/Orkeon.Examples.Shared.csproj -c Release -o artifacts
      # Interactive runner dotnet tools consumed by experiments/ in packages mode
      # (orkeon-claim-verify, orkeon-spec-forge). Same safety-net rationale.
      - run: dotnet pack  examples/runners/interactive-claim-verification/Orkeon.Examples.Interactive.ClaimVerification.csproj -c Release -o artifacts
      - run: dotnet pack  examples/runners/interactive-interview-spec-forge/Orkeon.Examples.Interactive.InterviewSpecForge.csproj -c Release -o artifacts
      - run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/Orkeon/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
      # NuGet.org — the public v1 set only (docs/reference/publication-matrix.md):
      # the three core libraries. Expanding this list is a maintainer decision
      # recorded in the matrix, not a workflow edit made in passing.
      - name: Warn when NuGet.org publishing is not configured
        if: env.NUGET_USER == ''
        run: echo "::warning::NuGet.org publish SKIPPED — the NUGET_USER repository variable is not set. Owner action -- on nuget.org create a Trusted Publishing policy (repo Orkeon/orkeon, workflow publish.yml), then set NUGET_USER to the policy's package owner (Settings > Secrets and variables > Actions > Variables)."
      - name: NuGet.org login (Trusted Publishing — OIDC, short-lived key)
        if: env.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}
      - name: Push core packages to NuGet.org
        if: env.NUGET_USER != ''
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # Satellites FIRST: since ADR-009 Orkeon.Domain carries a runtime reference to
          # Orkeon.Constants.Llm, so pushing Domain before it would publish a package whose
          # dependency cannot be restored. NuGet does not order pushes for us.
          #
          # No PackageId nests under any of these prefixes (see the matrix), so the simple
          # globs are exact.
          for id in Orkeon.Constants.Llm Orkeon.Constants.FileSystem Orkeon.Constants.Configuration Orkeon.Constants.Protocol Orkeon.Constants.Cli \
                    Orkeon.Domain Orkeon.Application Orkeon.Infrastructure; do
            dotnet nuget push "artifacts/${id}.*.nupkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" --skip-duplicate
          done
