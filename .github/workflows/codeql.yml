# CodeQL code scanning (C#). Uses build-mode: none — CodeQL extracts the
# C# codebase without compiling, which sidesteps the native-deps disk pressure
# the build workflows have to manage.
name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '31 4 * * 1'   # weekly, Monday 04:31 UTC
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read   # required by codeql-action on private repos (workflow-run lookup at upload time)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: csharp
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:csharp"
