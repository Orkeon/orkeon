# TEMPORARY (#444): runs the Safari suite on the macOS runner. Removed before the branch is merged.
name: browser-probe
on:
  push:
    branches: [feature/browser-engines]
    paths: ['.github/workflows/browser-probe.yml', 'src/tools/Orkeon.Tools.Web/Safari/**']
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { global-json-file: global.json }
      - run: sudo safaridriver --enable
      - run: dotnet build tests/tools/Orkeon.Tools.Web.Tests/Orkeon.Tools.Web.Tests.csproj -c Release
      - env: { ORKEON_TEST_BROWSER_SAFARI: /usr/bin/safaridriver }
        run: |
          set +e
          for i in 1 2 3; do
            echo "== run $i"; date; ps ax | grep -iE "safari" | grep -v grep | cut -c1-150
            dotnet test tests/tools/Orkeon.Tools.Web.Tests/Orkeon.Tools.Web.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~SafariToolIntegrationTests" --output Detailed -- --no-ansi
          done
          log show --last 12m --style compact --predicate 'process == "safaridriver"' | tail -n 60
