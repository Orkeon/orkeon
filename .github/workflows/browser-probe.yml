# TEMPORARY (#444, lot 7a): measures what safaridriver covers of WebDriver BiDi, and runs the Chromium
# suite on the browsers the hosted runners carry. Removed before the branch is merged.
name: browser-probe
on:
  push:
    branches: [feature/browser-engines]
    paths: [.github/workflows/browser-probe.yml]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with: { node-version: '22' }
      - name: Probe safaridriver
        run: |
          sw_vers; safaridriver --version
          ls -d /Applications/Safari*; sudo safaridriver --enable
          cat > probe.mjs <<'JS'
          import {spawn} from 'node:child_process';
          const base='http://127.0.0.1:4567';
          const p=spawn('/usr/bin/safaridriver',['-p','4567'],{stdio:'inherit'});
          await new Promise(r=>setTimeout(r,3000));
          const req=async(m,u,b)=>{const r=await fetch(base+u,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();console.log(m,u,r.status,t.slice(0,700));try{return JSON.parse(t).value}catch{return null}};
          await req('GET','/status');
          const s=await req('POST','/session',{capabilities:{alwaysMatch:{webSocketUrl:true}}});
          const url=s?.capabilities?.webSocketUrl; console.log('webSocketUrl:',url);
          if(url){
            const ws=new WebSocket(url);
            await new Promise((r,j)=>{ws.onopen=r;ws.onerror=e=>j(new Error('ws error '+(e.message||'')));setTimeout(()=>j(new Error('ws timeout')),10000)});
            let n=0;const w=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id!=null&&w.has(m.id)){w.get(m.id)(m)}else console.log('EVENT',e.data.slice(0,200))};
            const go=(method,params={})=>new Promise(r=>{const id=++n;const t=setTimeout(()=>{console.log('TIMEOUT',method);r(null)},8000);w.set(id,m=>{clearTimeout(t);console.log(m.type==='error'?'KO':'OK',method,JSON.stringify(m.error?{e:m.error,m:m.message}:m.result).slice(0,250));r(m.result)});ws.send(JSON.stringify({id,method,params}))});
            await go('session.status');
            await go('session.subscribe',{events:['browsingContext']});
            for(const e of ['contextCreated','contextDestroyed','load','navigationStarted','userPromptOpened','userPromptClosed','fragmentNavigated'])await go('session.subscribe',{events:['browsingContext.'+e]});
            const tree=await go('browsingContext.getTree',{maxDepth:0});const c=tree?.contexts?.[0]?.context;
            const page='data:text/html,<title>A</title><input id=i><button id=d onclick="alert(1)">x</button>';
            await go('browsingContext.navigate',{context:c,url:page,wait:'complete'});
            await go('script.evaluate',{expression:'document.title',target:{context:c},awaitPromise:true});
            await go('script.callFunction',{functionDeclaration:'(a)=>a+1',arguments:[{type:'number',value:1}],target:{context:c},awaitPromise:true});
            await go('script.callFunction',{functionDeclaration:'()=>1',arguments:[],target:{context:c,sandbox:'orkeon'},awaitPromise:true});
            await go('input.performActions',{context:c,actions:[{type:'key',id:'k',actions:[{type:'keyDown',value:'a'},{type:'keyUp',value:'a'}]}]});
            await go('input.releaseActions',{context:c});
            await go('browsingContext.captureScreenshot',{context:c,origin:'viewport'});
            const t=await go('browsingContext.create',{type:'tab'});
            if(t)await go('browsingContext.activate',{context:t.context});
            if(t)await go('browsingContext.close',{context:t.context});
            await go('browsingContext.traverseHistory',{context:c,delta:-1});
            await go('browsingContext.handleUserPrompt',{context:c,accept:false});
            await go('browser.close');
          } else if(s?.sessionId){
            await req('POST',`/session/${s.sessionId}/url`,{url:'data:text/html,<title>A</title>'});
            await req('GET',`/session/${s.sessionId}/title`);
            await req('DELETE',`/session/${s.sessionId}`);
          }
          const s2=await req('POST','/session',{capabilities:{alwaysMatch:{}}});
          if(s2?.sessionId)await req('DELETE',`/session/${s2.sessionId}`);
          p.kill();process.exit();
          JS
          node probe.mjs
  chromium:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { global-json-file: global.json }
      - run: dotnet build tests/tools/Orkeon.Tools.Web.Tests/Orkeon.Tools.Web.Tests.csproj -c Release
      - run: dotnet test tests/tools/Orkeon.Tools.Web.Tests/Orkeon.Tools.Web.Tests.csproj -c Release --no-build --filter "Category=Integration" -- --no-ansi
      - if: ${{ !cancelled() }}
        run: dotnet test tests/tools/Orkeon.Tools.Web.Tests/Orkeon.Tools.Web.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~Chromium|FullyQualifiedName~FirefoxEngine" -- --no-ansi
