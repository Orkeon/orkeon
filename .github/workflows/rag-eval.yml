# RAG evaluation gate (RAG-04/C1+C4, plan §9.3) — runs the golden dataset through
# `orkeon rag eval` on every change touching the RAG subsystem, 100 % offline:
#   - embeddings: local BGE-micro-v2 (SmartComponents ONNX, embedded model, no key),
#   - reranker: ms-marco-MiniLM-L-6-v2 cross-encoder (Orkeon.Rag.Onnx.Model,
#     int8 weights embedded — zero download),
#   - generation: --offline deterministic extractive stub (no LLM call),
#   - judge: deterministic heuristic (labelled in the report).
#
# Two steps:
#   1. profile comparison fast/balanced/quality/corrective/adaptive → table
#      published in the step summary and as an artifact (the plan's "published,
#      not proclaimed" proof);
#   2. anti-regression gate on the BALANCED profile (env floors below): the run
#      FAILS (exit 1) when the aggregate recall@5 or MRR — computed WITHOUT the
#      cases tagged `correctif`, which are seeded to defeat single-shot
#      retrieval (the corrective graph flips them with a real LLM; offline they
#      stay out of every gate) — drops below the floor.
# Keep the floors in sync with tests/e2e/.../RagEvalGoldenDatasetSlowTests.cs.
name: RAG Eval
on:
  push:
    branches: [ main ]
    paths:
      - 'src/rag/**'
      - 'src/tools/Orkeon.Tools.Rag/**'
      - 'src/tools/Orkeon.Tools.Embeddings.Local/**'
      - 'src/scripting/**'
      - 'src/hosting/**'
      - 'examples/rag/eval/**'
      - '.github/workflows/rag-eval.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/rag/**'
      - 'src/tools/Orkeon.Tools.Rag/**'
      - 'src/tools/Orkeon.Tools.Embeddings.Local/**'
      - 'src/scripting/**'
      - 'src/hosting/**'
      - 'examples/rag/eval/**'
      - '.github/workflows/rag-eval.yml'
permissions:
  contents: read
concurrency:
  group: rag-eval-${{ github.ref }}
  cancel-in-progress: true
env:
  RAG_EVAL_MIN_RECALL: '0.80'
  RAG_EVAL_MIN_MRR: '0.70'
jobs:
  rag-eval:
    runs-on: ubuntu-latest
    steps:
      # Same rationale as ci.yml: the CLI's dependency chain pulls heavy native
      # packages (treesitter, onnxruntime); free some hosted-runner disk first.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-rag-eval-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-rag-eval-${{ runner.os }}-
      - name: Build the orkeon CLI
        run: dotnet build src/scripting/Orkeon.Scripting.Cli/Orkeon.Scripting.Cli.csproj -c Release
      - name: Compare the fast/balanced/quality/corrective/adaptive profiles (offline)
        run: >
          dotnet run --project src/scripting/Orkeon.Scripting.Cli -c Release --no-build --
          rag eval
          --dataset examples/rag/eval/golden.yaml
          --compare fast,balanced,quality,corrective,adaptive
          --offline
      - name: Publish the comparison table to the step summary
        if: always()
        run: |
          if [ -f .orkeon/rag/eval/golden-compare.md ]; then
            cat .orkeon/rag/eval/golden-compare.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison table produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Gate on the balanced profile (offline, anti-regression)
        run: >
          dotnet run --project src/scripting/Orkeon.Scripting.Cli -c Release --no-build --
          rag eval
          --dataset examples/rag/eval/golden.yaml
          --profile balanced
          --offline
          --reindex
          --min-recall "$RAG_EVAL_MIN_RECALL"
          --min-mrr "$RAG_EVAL_MIN_MRR"
      # The reports are a convenience copy (the comparison table is already in
      # the step summary): short retention, and a storage-quota failure on the
      # upload must not fail the gate itself.
      - name: Upload evaluation reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-eval-reports
          path: .orkeon/rag/eval/
          if-no-files-found: warn
          retention-days: 3
