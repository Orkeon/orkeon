# Continuous integration — build + test on every push to main and every PR into main.
#
# Hosted runners (ubuntu-latest) only have ~14 GB free disk, but this repo pulls
# heavy native deps (treesitter.dotnet ~640 MB, onnxruntime ~300 MB, openxml, etc.)
# across 22 projects in Release. The first step frees ~20 GB so the build fits.
#
# The test phase runs unit + fast tests only. It EXCLUDES:
#   - Category=Integration → Testcontainers DB tests (pull GBs of MsSql/Postgres/
#     MySql/MariaDb/MongoDb images — the actual cause of "No space left on device",
#     plus the ~26 min runtime). They stay runnable locally / in a nightly job.
#   - Category=Slow
#   - Orkeon.Tools.Embeddings.Local.Tests → SIGSEGVs at teardown (exit 139); all its
#     tests still PASS, so it is re-run separately as a non-blocking step.
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          echo "Avant:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Après:"; df -h / | tail -1
      - uses: actions/checkout@v4
      # Bilingual docs gate (DOC-01/C3): every docs/**.md needs its docs/fr/ mirror
      # (and root community files their *.fr.md). Cheap, so it runs before the build.
      - name: Check docs FR/EN parity
        run: bash scripts/check-docs-parity.sh
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Orkeon.sln
      # PUB-18 ratchet: the solution builds at ZERO warnings (2026-06-15 campaign,
      # re-verified 2026-08-18) and -warnaserror keeps it there — any new compiler,
      # analyzer or NuGet-audit warning fails CI. Audit advisories breaking the
      # build is deliberate: fix the pin (see the SSH.NET precedent in CHANGELOG).
      - run: dotnet build Orkeon.sln -c Release --no-restore -warnaserror
      # Unit + fast tests only (see header for what's excluded and why).
      - run: dotnet test Orkeon.sln -c Release --no-build --filter "Category!=Integration&Category!=Slow&FullyQualifiedName!~Orkeon.Tools.Embeddings.Local"
      # Embeddings assembly alone, in its own test process (the native ONNX
      # runtime SIGSEGVs the host at TEARDOWN — exit 139 — after every test has
      # passed). PUB-17 T3: no blanket continue-on-error anymore — the step
      # inspects the results: a genuine test failure fails CI; only the known
      # crash-after-green teardown (exit 139 with a clean "Passed!" summary) is
      # tolerated, explicitly and loudly.
      - name: Test Embeddings.Local (tolerate teardown SIGSEGV only after green results)
        run: |
          set +e
          out="$(dotnet test tests/tools/Orkeon.Tools.Embeddings.Local.Tests/Orkeon.Tools.Embeddings.Local.Tests.csproj -c Release --no-build 2>&1)"
          rc=$?
          echo "$out"
          if [ $rc -eq 0 ]; then exit 0; fi
          if [ $rc -eq 139 ] && echo "$out" | grep -q "Passed!" && ! echo "$out" | grep -qE "Failed:[[:space:]]*[1-9]"; then
            echo "::warning::Embeddings.Local: all tests passed; the ONNX native runtime crashed the test host at teardown (exit 139 — known issue, tracked in PUB-17/SONAR-14). Treated as green."
            exit 0
          fi
          echo "::error::Embeddings.Local test run failed (exit $rc) with real failures — not the known teardown crash."
          exit $rc
