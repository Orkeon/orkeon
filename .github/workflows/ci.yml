# Continuous integration — build + test on every push to main and every PR into main.
#
# Hosted runners (ubuntu-latest) only have ~14 GB free disk, but this repo pulls
# heavy native deps (treesitter.dotnet ~640 MB, onnxruntime ~300 MB, openxml, etc.)
# across 22 projects in Release. The first step frees ~20 GB so the build fits.
#
# The test phase runs unit + fast tests only. It EXCLUDES:
#   - Category=Integration → Testcontainers DB tests (pull GBs of MsSql/Postgres/
#     MySql/MariaDb/MongoDb images — the actual cause of "No space left on device",
#     plus the ~26 min runtime). They stay runnable locally / in a nightly job.
#   - Category=Slow — the tests that boot the real ONNX model. They get their own step
#     below so a native-runtime failure names itself instead of dissolving into a
#     solution-wide run; the assembly's other 28 tests run with everyone else's.
#
# `dotnet test` here drives Microsoft.Testing.Platform, not VSTest: the .NET 10 SDK
# refuses the VSTest target for MTP test projects outright ("Testing with VSTest target
# is no longer supported"), so global.json opts the repo into the new runner. Two
# consequences for whoever edits the lines below — a --filter that leaves a module with
# ZERO matching tests is an error there (exit 8), not a silent no-op, which is why no
# step excludes a project by name any more; and VSTest-only flags (--collect, --logger)
# are rejected as unknown arguments.
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # tags: check-doc-claims.py compares the props version to `git tag`
      # Bilingual docs gate (DOC-01/C3): every docs/**.md needs its docs/fr/ mirror
      # (and root community files their *.fr.md). Cheap, so it runs before the build.
      - name: Check docs FR/EN parity
        run: bash scripts/check-docs-parity.sh
      # Numeric-claims gate (DOC-02/F1): provider/tool/memory-store/example/project
      # counts, the version string and the tag-state prose in README/INDEX/CLAUDE.md
      # are checked against the code -- exact numbers, no "N+" floors.
      # `scripts/count-surface.sh` prints the same ground truth with its rules.
      - name: Check documentation claims against the code
        run: python3 scripts/check-doc-claims.py
      # The gate reads what git would publish -- tracked and new files, never an ignored
      # path -- so a working clone's ignored trees (examples/others/) cannot slow it down
      # or fail it; proved on a scratch repository.
      - name: Test the documentation-claims file enumeration
        run: python3 scripts/test-check-doc-claims.py
      # The notices generator's rules (closure, package folders, texts, --check) proved on a
      # throw-away tree of fake assets files and a fake package cache: no restore needed.
      - name: Test the third-party notices generator
        run: python3 scripts/test-third-party-notices.py
      # Comment-language invariant: comments are English and never accented. Cheap and
      # build-free like its two neighbours, so it runs before setup-dotnet.
      - name: Check comments carry no accented letter
        run: python3 scripts/check-comment-accents.py
      # The dev channel's retention (scripts/prune-dev-packages.sh, run by publish.yml)
      # deletes versions from the GitHub feed; its rules are proved here against a fake
      # `gh`, with no network and no token, before any of it can run for real.
      - name: Test the dev-channel prune against a fake gh
        run: bash scripts/test-prune-dev-packages.sh
      # The apt repository's signing certificate (installers/apt/): its guard is proved on
      # throwaway keys made at test time (a subkey that ends within 180 days, a fingerprint
      # SECURITY.md does not cite), then run on the committed certificate. No secret involved.
      - name: Test and run the apt signing-key guard
        run: |
          bash scripts/apt/test-check-signing-key.sh
          bash scripts/apt/check-signing-key.sh
      # The apt index generator (scripts/apt/build-apt-index.sh): exact Release fields, the
      # merge and its refusals, the yank and the by-hash pruning, proved with a throwaway
      # key and dummy packages, no network. The real apt clients run in apt-index.yml.
      - name: Test the apt index generator offline
        run: |
          command -v apt-ftparchive >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils; }
          bash scripts/apt/test-build-apt-index.sh --offline
      # The apt installation block (docs/guides/install-with-apt.md and its French mirror):
      # one block, identical in both languages, writing exactly installers/apt/orkeon.sources
      # and checking the keyring SHA-256 of installers/apt. Proved on throw-away copies first.
      - name: Test and run the apt installation block guard
        run: |
          bash scripts/apt/test-check-apt-snippet.sh
          bash scripts/apt/check-apt-snippet.sh
      # The one script that pushes the apt branch (scripts/apt/publish-apt-channel.sh), proved
      # against a local bare repository: orphan bootstrap, a channel replaced exactly, the
      # --base refusal, the retry on a branch moved meanwhile. Git only, no network.
      - name: Test the apt branch publisher
        run: bash scripts/apt/test-publish-apt-channel.sh
      # The apt dev channel (scripts/apt/publish-dev.sh, run by apt-dev.yml): its version is
      # publish.yml's, it keeps the three newest builds, and an asset leaves the apt-dev
      # prerelease only after the pushed index has dropped it - proved against a fake gh.
      - name: Test the apt dev channel against a fake gh
        run: bash scripts/apt/test-publish-dev.sh
      # Release asset names (scripts/check-release-assets.sh): no character GitHub rewrites
      # on upload, and every asset listed in a checksum manifest.
      - name: Test the release asset-name guard
        run: bash scripts/test-check-release-assets.sh
      # Scripting-DSL contract gate: the shipped .ork.ts examples are typechecked against
      # the shipped Typings/*.d.ts. The examples are also executed by the test suite, so
      # agreement here means the declarations and the Jint runtime describe one API. Seven
      # divergences had accumulated before this existed, most of them silent at run time
      # (see the script's header). esbuild cannot catch them: it strips types, it does not
      # check them.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with: { node-version: '22' }
      - name: Typecheck the scripting examples against the shipped typings
        run: bash scripts/check-scripting-typings.sh
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The restore fills packages/ (RestorePackagesPath, Directory.Build.props), not
          # ~/.nuget/packages, which keeps only the dotnet tools and the MSBuild SDKs NuGet resolves.
          path: |
            packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Orkeon.sln
      # Third-party notices gate (GAP-36): THIRD-PARTY-NOTICES.md must list every package the
      # shipped applications redistribute. The script reads the assets files this restore just
      # wrote and the nuspecs of the package folder they name, never the network, so it runs
      # here: after the restore, before the build. A package bump (Dependabot's included) fails
      # it until `python3 scripts/third-party-notices.py` is run and the file committed.
      - name: Check the third-party notices cover the shipped closure
        run: python3 scripts/third-party-notices.py --check
      # PUB-18 ratchet: the solution builds at ZERO warnings (2026-06-15 campaign,
      # re-verified 2026-08-18) and -warnaserror keeps it there — any new compiler,
      # analyzer or NuGet-audit warning fails CI. Audit advisories breaking the
      # build is deliberate: fix the pin (see the SSH.NET precedent in CHANGELOG).
      - run: dotnet build Orkeon.sln -c Release --no-restore -warnaserror
      # Unit + fast tests only (see header for what's excluded and why).
      - run: dotnet test Orkeon.sln -c Release --no-build --filter "Category!=Integration&Category!=Slow"
      # The ONNX tests of Embeddings.Local, alone, so a native-runtime failure names
      # itself. This step used to tolerate a SIGSEGV (exit 139) held to be an ONNX
      # teardown artefact. It was not one: Dispose_Releases_Embedder called straight
      # into the freed native session, and that read landed wherever the heap was
      # dirty — often before a single result had been reported, which is how the
      # 2026-09-07 run failed with "Zero tests ran". Worse, the accounting this step
      # trusted came from the crashed process itself, so the truncated total always
      # matched succeeded + skipped and no lost test could ever be seen. The provider
      # now throws ObjectDisposedException instead of dereferencing freed memory, and
      # the suite exits 0 — 17 runs in a row. Any exit code is a failure again.
      - run: dotnet test tests/tools/Orkeon.Tools.Embeddings.Local.Tests/Orkeon.Tools.Embeddings.Local.Tests.csproj -c Release --no-build --filter "Category=Integration|Category=Slow"

  # .NET 11 readiness (GA on 2026-11-10, during .NET Conf). Everything still targets
  # net10.0 and global.json still pins the 10.0.300 feature band -- this job is the
  # early warning, not the migration: it builds and tests the same solution with the
  # .NET 11 SDK (preview channel until GA) so a breaking change in the compiler, the
  # SDK targets or a NuGet resolution shows up weeks before the day the tag moves.
  # global.json's `latestFeature` would refuse an 11.x SDK, so the job widens the
  # roll-forward on the runner only; the committed file does not change.
  # continue-on-error until GA: a preview SDK may break for reasons that are not ours;
  # the job result stays visible on the run page either way.
  build-test-net11-preview:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The restore fills packages/ (RestorePackagesPath, Directory.Build.props), not
          # ~/.nuget/packages, which keeps only the dotnet tools and the MSBuild SDKs NuGet resolves.
          path: |
            packages
            ~/.nuget/packages
          key: nuget-net11-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-net11-${{ runner.os }}-
      - name: Let the 11.x SDK build a 10.0.300-pinned tree (runner only)
        run: |
          python3 - <<'PY'
          import json
          g = json.load(open("global.json"))
          g["sdk"]["rollForward"] = "latestMajor"
          json.dump(g, open("global.json", "w"), indent=2)
          PY
          dotnet --version
      - run: dotnet restore Orkeon.sln
      - run: dotnet build Orkeon.sln -c Release --no-restore -warnaserror
      - run: dotnet test Orkeon.sln -c Release --no-build --filter "Category!=Integration&Category!=Slow"
