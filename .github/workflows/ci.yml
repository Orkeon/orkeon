# Continuous integration — build + test on every push to main and every PR into main.
#
# Hosted runners (ubuntu-latest) only have ~14 GB free disk, but this repo pulls
# heavy native deps (treesitter.dotnet ~640 MB, onnxruntime ~300 MB, openxml, etc.)
# across 22 projects in Release. The first step frees ~20 GB so the build fits.
#
# The test phase runs unit + fast tests only. It EXCLUDES:
#   - Category=Integration → Testcontainers DB tests (pull GBs of MsSql/Postgres/
#     MySql/MariaDb/MongoDb images — the actual cause of "No space left on device",
#     plus the ~26 min runtime). They stay runnable locally / in a nightly job.
#   - Category=Slow — the tests that boot the real ONNX model. They get their own step
#     below so a native-runtime failure names itself instead of dissolving into a
#     solution-wide run; the assembly's other 28 tests run with everyone else's.
#
# `dotnet test` here drives Microsoft.Testing.Platform, not VSTest: the .NET 10 SDK
# refuses the VSTest target for MTP test projects outright ("Testing with VSTest target
# is no longer supported"), so global.json opts the repo into the new runner. Two
# consequences for whoever edits the lines below — a --filter that leaves a module with
# ZERO matching tests is an error there (exit 8), not a silent no-op, which is why no
# step excludes a project by name any more; and VSTest-only flags (--collect, --logger)
# are rejected as unknown arguments.
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Bilingual docs gate (DOC-01/C3): every docs/**.md needs its docs/fr/ mirror
      # (and root community files their *.fr.md). Cheap, so it runs before the build.
      - name: Check docs FR/EN parity
        run: bash scripts/check-docs-parity.sh
      # Numeric-claims gate (DOC-02/F1): provider/tool/example/project counts and
      # the version string in README/INDEX/CLAUDE.md are checked against the code.
      - name: Check documentation claims against the code
        run: python3 scripts/check-doc-claims.py
      # Comment-language invariant: comments are English and never accented. Cheap and
      # build-free like its two neighbours, so it runs before setup-dotnet.
      - name: Check comments carry no accented letter
        run: python3 scripts/check-comment-accents.py
      # Scripting-DSL contract gate: the shipped .ork.ts examples are typechecked against
      # the shipped Typings/*.d.ts. The examples are also executed by the test suite, so
      # agreement here means the declarations and the Jint runtime describe one API. Seven
      # divergences had accumulated before this existed, most of them silent at run time
      # (see the script's header). esbuild cannot catch them: it strips types, it does not
      # check them.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with: { node-version: '22' }
      - name: Typecheck the scripting examples against the shipped typings
        run: bash scripts/check-scripting-typings.sh
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Orkeon.sln
      # PUB-18 ratchet: the solution builds at ZERO warnings (2026-06-15 campaign,
      # re-verified 2026-08-18) and -warnaserror keeps it there — any new compiler,
      # analyzer or NuGet-audit warning fails CI. Audit advisories breaking the
      # build is deliberate: fix the pin (see the SSH.NET precedent in CHANGELOG).
      - run: dotnet build Orkeon.sln -c Release --no-restore -warnaserror
      # Unit + fast tests only (see header for what's excluded and why).
      - run: dotnet test Orkeon.sln -c Release --no-build --filter "Category!=Integration&Category!=Slow"
      # The ONNX tests of Embeddings.Local, alone, so a native-runtime failure names
      # itself. This step used to tolerate a SIGSEGV (exit 139) held to be an ONNX
      # teardown artefact. It was not one: Dispose_Releases_Embedder called straight
      # into the freed native session, and that read landed wherever the heap was
      # dirty — often before a single result had been reported, which is how the
      # 2026-09-07 run failed with "Zero tests ran". Worse, the accounting this step
      # trusted came from the crashed process itself, so the truncated total always
      # matched succeeded + skipped and no lost test could ever be seen. The provider
      # now throws ObjectDisposedException instead of dereferencing freed memory, and
      # the suite exits 0 — 17 runs in a row. Any exit code is a failure again.
      - run: dotnet test tests/tools/Orkeon.Tools.Embeddings.Local.Tests/Orkeon.Tools.Embeddings.Local.Tests.csproj -c Release --no-build --filter "Category=Integration|Category=Slow"
