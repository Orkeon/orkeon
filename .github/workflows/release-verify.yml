# Post-publish verification — "scenario C on PUBLISHED artifacts" (PUB-20).
#
# The release.yml smokes install from the JOB artifacts so a broken payload is
# caught BEFORE anything is published. This workflow closes the remaining gap
# from the 2026-07-10 onboarding audit: once the GitHub Release exists, verify
# that what a real user downloads from the Release page walks the same
# onboarding chain — the assets could differ from the job artifacts only
# through an upload/tamper/replace accident, which is exactly what this
# catches. Reuses the same smoke scripts, pointed at the Release assets.
#
# Triggers: release.yml calls this workflow (workflow_call, job verify-published)
# right after its release job, in the same run; workflow_dispatch replays it on
# any tag. There is no `release: published` trigger: release.yml creates the
# Release with GITHUB_TOKEN, and an event raised by that token starts no other
# workflow, so such a trigger never fired. When called, this workflow runs with
# the permissions of the calling job, which grants contents: read and no more.
name: Release verify (published assets)
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v1.0.0-rc.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v1.0.0-rc.1)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  # Only a v* tag is a release. The apt-dev prerelease holds the dev builds of the apt
  # repository (apt-dev.yml): several versions at once, no SHA256SUMS, nothing these
  # checks could verify. Refused here rather than reported as a broken release.
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag names a release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v*) echo "Verifying $TAG." ;;
            *) echo "::error::'$TAG' is not a release tag (v*); apt-dev and other non-v tags are not verified here."; exit 1 ;;
          esac

  # One entry per Debian architecture, as in release.yml's smoke-deb: the arm64
  # package is smoked on a real ARM runner, checked to be one before installing.
  verify-deb:
    needs: release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: verify-deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the runner architecture
        run: |
          actual="$(dpkg --print-architecture)"
          if [[ "$actual" != "${{ matrix.arch }}" ]]; then
            echo "::error::This verify-deb entry is for ${{ matrix.arch }}, but the runner is $actual." >&2
            exit 1
          fi
      - name: Download the published .deb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p published
          gh release download "$TAG" --pattern 'orkeon_*_${{ matrix.arch }}.deb' --dir published
          ls -la published
      - name: Smoke the published package
        run: |
          deb="$(find published -maxdepth 1 -name 'orkeon_*_${{ matrix.arch }}.deb' | head -n1)"
          if [[ -z "$deb" ]]; then
            echo "No orkeon_*_${{ matrix.arch }}.deb among the published assets." >&2
            exit 1
          fi
          ./scripts/smoke-onboarding/run-smoke-deb.sh --deb "$deb"

  verify-macos:
    needs: release-tag
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the published osx-arm64 tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p published
          gh release download "$TAG" --pattern 'orkeon-cli-*-osx-arm64.tar.gz' --dir published
          ls -la published
      - name: Smoke the published tarball
        run: |
          tarball="$(find published -maxdepth 1 -name 'orkeon-cli-*-osx-arm64.tar.gz' | head -n1)"
          if [[ -z "$tarball" ]]; then
            echo "No orkeon-cli-*-osx-arm64.tar.gz among the published assets." >&2
            exit 1
          fi
          ./scripts/smoke-onboarding/run-smoke-tarball.sh --tarball "$tarball" --studio absent

  # Every published asset has exactly one checksum line, and every line names a
  # published asset: the asset list comes from the Release itself, not from the
  # files the download happened to bring back. Without --ignore-missing, a line
  # whose file is absent is an error rather than a line skipped in silence.
  verify-checksums:
    needs: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download every published asset and verify both manifests against it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p published
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          gh release download "$TAG" --repo "$REPO" --dir published
          # Two checksum files by design (see publication-matrix): SHA256SUMS
          # covers everything but the MSIs; SHA256SUMS.msi covers the two MSIs (CLI and service host).
          ./scripts/check-release-assets.sh --assets "$RUNNER_TEMP/assets.txt" published SHA256SUMS SHA256SUMS.msi
