# Nightly integration run (PUB-17 T2): everything ci.yml deliberately excludes.
#
# ci.yml stays fast on PRs (unit + fast tests only). This workflow runs the
# Category=Integration and Category=Slow suites — Testcontainers pulls real
# database images (Redis, Postgres, MsSql, Mongo, MariaDb…), so it needs the
# Docker daemon of a hosted ubuntu runner and tens of minutes. A red run is
# VISIBLE: it opens (or comments) a pinned tracking issue instead of dying in
# a log nobody reads.
#
# Two things this run inherits from Microsoft.Testing.Platform (global.json):
#   - selecting one category across the whole solution leaves MOST modules with zero
#     matching tests, and MTP calls that an error (exit 8) per module. Hence
#     --ignore-exit-code 8, plus an explicit check that the run as a whole executed
#     something: tolerating "zero tests" per module must not make "zero tests anywhere"
#     — a mistyped filter — look green.
#   - Embeddings.Local is left out: its 8 ONNX tests crash the process at exit 139
#     after passing, and ci.yml already runs exactly those on every push with a guard
#     that tells that crash apart from a real failure. Repeating them here would only
#     mean a nightly that is red for a reason we already accept.
name: Integration (nightly)
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC nightly (odd minute to dodge the cron rush)
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: integration-nightly
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free up runner disk space
        # The 2026-09-01 run died at "0 MB free": Release build of the full solution
        # + NuGet cache + the Testcontainers images (mssql alone unpacks to ~2.5 GB)
        # need more headroom than the historical short list provided. None of the
        # trees below is used by this job (dotnet lives in /usr/share/dotnet, and
        # the runner's actions ship their own Node in externals/).
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache /usr/lib/jvm /usr/lib/google-cloud-sdk /opt/az /usr/share/az_* \
            /usr/share/miniconda /usr/local/julia* /usr/local/lib/node_modules \
            /usr/local/share/powershell /opt/microsoft/powershell /usr/local/share/chromium \
            /opt/google/chrome /usr/lib/firefox
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Orkeon.sln
      - run: dotnet build Orkeon.sln -c Release --no-restore
      - name: Run Integration + Slow suites (Testcontainers)
        run: |
          set +e
          out="$(dotnet test Orkeon.sln -c Release --no-build \
            --filter "(Category=Integration|Category=Slow)&FullyQualifiedName!~Orkeon.Tools.Embeddings.Local" \
            -- --ignore-exit-code 8 --no-ansi 2>&1)"
          rc=$?
          echo "$out"
          # MTP colors its summary; strip ANSI escapes before parsing "total:" so the
          # guard reads the real count (the 2026-09-01 run mis-reported "no test at
          # all" on a run that executed 99 because ESC[m defeated the anchor).
          total="$(printf '%s\n' "$out" | sed -e 's/\x1b\[[0-9;]*m//g' | sed -n 's/^[[:space:]]*total:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' | tail -1)"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::No parsable test total for this run — either the filter selected nothing solution-wide, or the summary is missing. Check the log above before trusting any other diagnosis."
            exit 1
          fi
          exit $rc
      - name: Surface the failure as a tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly integration run is red"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          body="Nightly Integration/Slow suites failed: $RUN_URL"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
