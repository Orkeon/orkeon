# Nightly integration run (PUB-17 T2): everything ci.yml deliberately excludes.
#
# ci.yml stays fast on PRs (unit + fast tests only). This workflow runs the
# Category=Integration and Category=Slow suites — Testcontainers pulls real
# database images (Redis, Postgres, MsSql, Mongo, MariaDb…), so it needs the
# Docker daemon of a hosted ubuntu runner and tens of minutes. A red run is
# VISIBLE: it opens (or comments) a pinned tracking issue instead of dying in
# a log nobody reads.
#
# Two things this run inherits from Microsoft.Testing.Platform (global.json):
#   - selecting one category across the whole solution leaves MOST modules with zero
#     matching tests, and MTP calls that an error (exit 8) per module. Hence
#     --ignore-exit-code 8, plus an explicit FLOOR on the reported total: tolerating
#     "zero tests" per module must not make "zero tests anywhere" — a mistyped filter —
#     look green, and neither must "a handful of tests anywhere".
#
# The floor is only half the guard. The database fixtures SKIP rather than fail when a
# container will not start, so the run stays green with a full test total while having
# exercised no database at all; the last step therefore asserts, against the local image
# store, that Testcontainers really pulled and started them. See its comment.
#   - Embeddings.Local used to be left out here, because its ONNX tests crashed the
#     process at exit 139. That crash was a call into a disposed native session, not a
#     property of the runtime; it is fixed, the suite exits 0, and the sweep now
#     covers it like any other.
name: Integration (nightly)
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC nightly (odd minute to dodge the cron rush)
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: integration-nightly
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free up runner disk space
        # The 2026-09-01 run died at "0 MB free": Release build of the full solution
        # + NuGet cache + the Testcontainers images (mssql alone unpacks to ~2.5 GB)
        # need more headroom than the historical short list provided. None of the
        # trees below is used by this job (dotnet lives in /usr/share/dotnet, and
        # the runner's actions ship their own Node in externals/).
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache /usr/lib/jvm /usr/lib/google-cloud-sdk /opt/az /usr/share/az_* \
            /usr/share/miniconda /usr/local/julia* /usr/local/lib/node_modules \
            /usr/local/share/powershell /opt/microsoft/powershell /usr/local/share/chromium \
            /opt/google/chrome /usr/lib/firefox
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Orkeon.sln
      - run: dotnet build Orkeon.sln -c Release --no-restore
      - name: Run Integration + Slow suites (Testcontainers)
        env:
          # Floor on the number of tests the run must report. The nightly executes ~99
          # today; the floor sits well under that so a normal add/remove never trips it,
          # while a filter typo, a module silently dropping out of the sweep, or a
          # solution restructure that stops selecting the suites still does. Raise it
          # when the real count grows durably; never lower it to make a red run green.
          MIN_TESTS: '60'
        run: |
          set +e
          out="$(dotnet test Orkeon.sln -c Release --no-build \
            --filter "Category=Integration|Category=Slow" \
            -- --ignore-exit-code 8 --no-ansi 2>&1)"
          rc=$?
          echo "$out"
          # MTP colors its summary; strip ANSI escapes before parsing "total:" so the
          # guard reads the real count (the 2026-09-01 run mis-reported "no test at
          # all" on a run that executed 99 because ESC[m defeated the anchor).
          # Take the MAXIMUM of the parsed totals, not the last one: MTP prints a summary
          # per module and, depending on the SDK build, an aggregate after them — the max
          # is the aggregate under one layout and the biggest module under the other, and
          # the floor below is meaningful in both.
          total="$(printf '%s\n' "$out" | sed -e 's/\x1b\[[0-9;]*m//g' | sed -n 's/^[[:space:]]*total:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' | sort -n | tail -1)"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::No parsable test total for this run — either the filter selected nothing solution-wide, or the summary is missing. Check the log above before trusting any other diagnosis."
            exit 1
          fi
          if [ "$total" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $total test(s) reported, expected at least $MIN_TESTS. The sweep selected far less than it should — check the filter and that every suite module still ran, do NOT lower MIN_TESTS to clear this."
            exit 1
          fi
          echo "Test total reported: $total (floor: $MIN_TESTS)"
          exit $rc

      # The database suites do not FAIL when Docker is unusable — every fixture catches
      # its container-start error and the tests then call Assert.SkipWhen(...), so a
      # wedged daemon, an exhausted disk mid-pull (what killed 2026-09-01) or a broken
      # Testcontainers setup produces a GREEN nightly that tested no database at all.
      # A test total cannot see that: the skipped tests are still counted.
      #
      # What proves the containers really started is the local image store. The disk
      # cleanup at the top of this job prunes every image, so anything present here was
      # pulled by this run. Repository names only (no tags): a fixture bumping
      # `mongo:7.0` to `mongo:8.0` must not turn this guard red.
      # Source of the list: tests/tools/Orkeon.Tools.Data.Tests/Integration/*IntegrationTests.cs
      # (ArcadeDB and JanusGraph are deliberately absent — they have no Testcontainers
      # module and legitimately skip on a hosted runner).
      - name: Assert the container-gated suites actually ran
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          present="$(docker image ls --format '{{.Repository}}' | sort -u)"
          echo "Images pulled by this run:"; printf '%s\n' "$present" | sed 's/^/  - /'
          missing=""
          for repo in mariadb mongo mysql postgres mcr.microsoft.com/mssql/server; do
            printf '%s\n' "$present" | grep -qx "$repo" || missing="$missing $repo"
          done
          if [ -n "$missing" ]; then
            echo "::error::Testcontainers never started:$missing — the database suites SKIPPED instead of failing, so this run proves nothing about them. Check the Docker daemon and the runner's free disk above."
            exit 1
          fi
          echo "All five Testcontainers images were pulled — the database suites really executed."
      - name: Surface the failure as a tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly integration run is red"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          body="Nightly Integration/Slow suites failed: $RUN_URL"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
