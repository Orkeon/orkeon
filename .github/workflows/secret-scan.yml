# Secret scanning (gitleaks) — the gate that has to be green before an outside PR
# is even read.
#
# `.gitleaks.toml` has been committed since the open-source release audit (it extends
# gitleaks' default ruleset and allowlists eight *reviewed* false positives, by exact
# path). Nothing ran it: this workflow is what turns that config into an enforced rule.
#
# Scope: the full history, not just the diff. `fetch-depth: 0` is what lets gitleaks
# walk every commit — a secret added then reverted in a later commit still has to be
# caught and rotated.
#
# Why the BINARY and not gitleaks/gitleaks-action: the action requires a paid
# GITLEAKS_LICENSE for repositories owned by an ORGANISATION, and Orkeon is one (see
# .github/CODEOWNERS, which addresses a team). The action would fail on licensing on
# the very first public push. The gitleaks CLI itself is MIT-licensed and free — so we
# install a pinned release and run it directly.
#
# Owner follow-up: pin the release by SHA-256 as well as by version. The checksum could
# not be computed when this workflow was written (no network), and gitleaks publishes a
# checksums file with every release:
#   curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_checksums.txt
#
# Findings stay in the job log, redacted. No SARIF artifact on purpose: on a public repo
# it would publish the matched material as a downloadable file.
name: Secret scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
env:
  GITLEAKS_VERSION: '8.28.0'
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the working tree
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the history for secrets (committed .gitleaks.toml)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
