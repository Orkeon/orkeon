# The README's "Try it in two minutes -- no API key" blocks, executed literally.
#
# The job does not have its own copy of the commands: it cuts the two fenced blocks out
# of README.md -- the run between <!-- quickstart:begin --> / <!-- quickstart:end -->,
# and the refused run between <!-- quickstart-refused:begin --> / <!-- quickstart-refused:end -->
# -- checks that README.fr.md carries the identical blocks, and runs them in order. The
# first must write orkeon-quickstart/out/hello.md; the second, the same crew on a
# read-only mount, must be refused by the file-system service and leave the file as it
# was. Change the README and the job runs the new README; break it and the job goes red.
#
# Everything the block needs is provided the way a reader would provide it, pinned:
# the .NET 10 SDK, an Ollama binary downloaded from its GitHub release and checked
# against the release's sha256sum.txt (no curl | sh), and the `orkeon` tool. The only
# indirection is where `dotnet tool install -g Orkeon.Scripting.Cli --prerelease`
# resolves the package: a nuget.config in the working directory makes a local pack of
# THIS checkout the only source (a tool package carries its dependencies, so no feed
# is needed), and the block installs the code under test, never a published release
# -- whatever version either carries. The line itself is untouched.
name: Quickstart
on:
  push:
    branches: [ main ]
    paths:
      - README.md
      - README.fr.md
      - examples/quickstart/**
      - src/**
      - Directory.Packages.props
      - Directory.Build.props
      - global.json
      - .github/workflows/quickstart.yml
  pull_request:
    branches: [ main ]
    paths:
      - README.md
      - README.fr.md
      - examples/quickstart/**
      - src/**
      - Directory.Packages.props
      - Directory.Build.props
      - global.json
      - .github/workflows/quickstart.yml
  schedule:
    - cron: '41 5 * * 1'  # Mondays 05:41 UTC -- a README that rots quietly rots weekly at most
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true
env:
  OLLAMA_VERSION: 0.34.0
  OLLAMA_SHA256: cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804
jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The restore fills packages/ (RestorePackagesPath, Directory.Build.props), not
          # ~/.nuget/packages, which keeps only the dotnet tools and the MSBuild SDKs NuGet resolves.
          path: |
            packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # The model weights (986 MB) survive between runs; the pull in the block is then a
      # no-op that still exercises the command.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-1.5b

      - name: Cut the blocks out of README.md, and check README.fr.md carries the same ones
        run: |
          extract() {  # extract <marker> <file>
            awk -v b="<!-- ${1}:begin -->" -v e="<!-- ${1}:end -->" \
              'index($0, b){on=1; next} index($0, e){on=0} on' "$2" \
              | grep -v '^```'
          }
          for marker in quickstart quickstart-refused; do
            extract "$marker" README.md    > "$marker.sh"
            extract "$marker" README.fr.md > "$marker.fr.sh"
            if ! diff -u "$marker.sh" "$marker.fr.sh"; then
              echo "::error::README.md and README.fr.md carry different $marker blocks"; exit 1
            fi
            test -s "$marker.sh" || { echo "::error::no $marker block found between the markers"; exit 1; }
            echo "--- the $marker block that will run:"; cat "$marker.sh"
          done

      - name: Install Ollama (pinned release, checked against its published digest)
        run: |
          curl -fsSL -o ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ollama.tar.zst" | sha256sum --check
          mkdir -p "$HOME/ollama" && tar --zstd -xf ollama.tar.zst -C "$HOME/ollama"
          echo "$HOME/ollama/bin" >> "$GITHUB_PATH"
          "$HOME/ollama/bin/ollama" serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS localhost:11434/api/version && break
            sleep 1
          done

      # `dotnet tool install -g Orkeon.Scripting.Cli --prerelease` -- the block's own line --
      # must install this checkout. The nuget.config below makes the pack directory the ONLY
      # source in the directory the block runs from: with nuget.org as a fallback, a
      # published stable 1.0.0 would outrank a local 1.0.0-ci<run> and the job would test
      # the release instead of the change. The .ci<run> suffix only labels the pack.
      - name: Pack the orkeon tool from this checkout, as the only source
        run: |
          prefix=$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' src/Directory.Build.props)
          suffix=$(sed -n 's/.*<VersionSuffix>\([^<]*\)<\/VersionSuffix>.*/\1/p' src/Directory.Build.props)
          ci_suffix="${suffix:+$suffix.}ci${GITHUB_RUN_NUMBER}"
          echo "packing $prefix-$ci_suffix"
          dotnet pack src/scripting/Orkeon.Scripting.Cli/Orkeon.Scripting.Cli.csproj -c Release \
            -o "$PWD/artifacts/cli" -p:VersionSuffix="$ci_suffix"
          cat > nuget.config <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="this-checkout" value="$PWD/artifacts/cli" />
            </packageSources>
          </configuration>
          XML

      - name: Run the README's first block
        run: |
          set -o pipefail
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$HOME/.dotnet/tools:$PATH"
          bash -euxo pipefail quickstart.sh 2>&1 | tee quickstart.log

      - name: The agent wrote where it was allowed to
        run: |
          test -s orkeon-quickstart/out/hello.md || { echo "::error::orkeon-quickstart/out/hello.md was not written"; exit 1; }
          grep -q "Hello from Orkeon" orkeon-quickstart/out/hello.md
          orkeon --version
          echo "--- orkeon-quickstart/out/hello.md"; cat orkeon-quickstart/out/hello.md

      # The block runs from orkeon-quickstart/, where the first one left the reader. Its exit
      # code is not the claim -- a model may report the refusal and still finish -- the
      # refusal in the log and the untouched file are.
      - name: Run the README's second block -- the same crew, the mount read-only
        working-directory: orkeon-quickstart
        run: |
          sha256sum out/hello.md > ../hello.before.sha256
          status=0
          bash -eux ../quickstart-refused.sh > ../quickstart-refused.log 2>&1 || status=$?
          cat ../quickstart-refused.log
          echo "--- exit code of the refused run: $status"

      - name: The write was refused, and the file is unchanged
        run: |
          grep -q "required Write, effective ReadOnly" quickstart-refused.log \
            || { echo "::error::the read-only run did not log 'required Write, effective ReadOnly'"; exit 1; }
          (cd orkeon-quickstart && sha256sum --check ../hello.before.sha256) \
            || { echo "::error::orkeon-quickstart/out/hello.md changed under a read-only mount"; exit 1; }

      - name: Keep the run's evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickstart-run
          path: |
            orkeon-quickstart/out/
            quickstart.sh
            quickstart-refused.sh
            quickstart.log
            quickstart-refused.log
            ollama.log
          if-no-files-found: ignore
          retention-days: 14
