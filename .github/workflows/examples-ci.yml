# Examples CI — validates the numbered example catalog (config.yaml + README.md) and
# their wiring on every change under examples/, src/ or scripts/.
#
# The trigger covers src/** and not just src/hosting/**: an example exercises the whole
# engine, so a change to the Domain, the Application or a strategy can break the catalog
# while leaving every unit test green. It did — `process: parallel` ignored `dependencies:`
# in 23 of the 30 examples that declare them, and tightening the `process:` parser could
# have failed any config with a typo — and neither change would have run this job.
#
# Two of the three jobs are pure-Python static lints (no dotnet build, no PyYAML): the
# tool manifests they check against are committed under scripts/data/ and regenerated
# from the stock CLI's `run --list-tools` contract. The third job COMPILES
# examples/Orkeon.Examples.sln (warnings as errors) and then runs the shared
# validate-all-examples.sh over the whole catalog, so it needs the .NET 10 SDK and,
# like the main CI, some extra free disk on the hosted runner.
#
# The compile step is not redundant with the validation sweep: validate-all-examples.sh
# builds the `orkeon` CLI alone and then loads each crew definition, so a SOURCE-breaking
# change to the framework (a constructor signature, a renamed type) went in with zero
# example coverage — c17fab7b shipped exactly that. The examples solution is the only
# place a real consumer's C# is compiled against the public API.
name: Examples CI
on:
  push:
    branches: [ main ]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/examples-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/examples-ci.yml'
permissions:
  contents: read
concurrency:
  group: examples-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Lint example config.yaml (tool names, structure)
        run: python3 scripts/lint-example-configs.py

  lint-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Lint example README.md (launch section, links)
        run: python3 scripts/lint-example-readmes.py
      # lint-example-readmes.py already runs INDEX --check, but keep an explicit
      # step so a stale INDEX is easy to spot in the job log.
      - name: Verify examples/INDEX.md is up to date
        run: bash scripts/generate-examples-index.sh --check

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '10.0.x' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build the examples solution (warnings are errors)
        run: dotnet build examples/Orkeon.Examples.sln -c Release -warnaserror
      - name: Validate every example crew definition
        run: bash scripts/validate-all-examples.sh
      # The tutorial crew lives in examples/scripting/, not in a numbered NN-category/
      # directory, so the `examples/0[0-9]-*` glob of the sweep above does not reach it.
      # It is the worked example the TypeScript guide is built on, so it is validated by
      # name rather than left uncovered.
      - name: Validate the tutorial TypeScript crew
        run: bash scripts/validate-all-examples.sh --configs examples/scripting/crew-review-desk/main.ork.ts
