version: 2
updates:
  # NuGet — one weekly PR wave, minor/patch grouped to keep the noise down.
  # /examples: Orkeon.Examples.sln is a separate solution that Orkeon.sln does not
  # reference; its versions are the root Directory.Packages.props, but two of them
  # (Aspire.Hosting.AppHost, Microsoft.Agents.AI) are referenced by examples alone.
  - package-ecosystem: nuget
    directories: [ /, /examples ]
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  # GitHub Actions pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # `init` and `analyze` are one action at one commit: bumped apart, `analyze`
      # refuses the configuration `init` wrote and every CodeQL job fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The esbuild toolchain lockfile used by the scripting layer.
  - package-ecosystem: npm
    directory: /tools/scripting-esbuild
    schedule:
      interval: weekly
      day: monday

  # The TypeScript type checker the scripting typings gate runs.
  - package-ecosystem: npm
    directory: /tools/scripting-typecheck
    schedule:
      interval: weekly
      day: monday

  # Base images of the root Dockerfile and Dockerfile.runners. Both pin
  # `mcr.microsoft.com/dotnet/{sdk,runtime}:10.0@sha256:<digest>`: Dependabot refreshes the
  # digest as Microsoft republishes 10.0. A new major is ignored: every project targets
  # net10.0 and global.json pins the 10.0 SDK, so an 11.0 runtime image would not start
  # orkeon-host or the runners. Moving to .NET 11 is a migration of its own, not a bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  # Base images of the deploy stack (Dockerfile.host): same digest pin, same major rule.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
