name: Feature request
description: Propose an improvement or a new capability
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Orkeon makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? YAML/API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, other frameworks' approaches, or why the existing extension points (custom tools, plugins, hooks) are not enough.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Orchestration (processes, FSM, graph, autonomous)
        - Tools
        - LLM providers
        - Memory / RAG
        - Scripting DSL / CLI
        - Packaging / install channels
        - Documentation
        - Other
    validations:
      required: true
