# RaggableTree crew, declared entirely in YAML and run by the stock CLI:
#
#   orkeon run crew.yaml --mount <repo-to-explore>:/src:ro
#
# The runner registers the RaggableTree subsystem and its agent tools by
# default (opt out with "RaggableTree:Enabled": false in --settings); the
# navigator indexes the mounted tree on demand through index_codebase, then
# the crew answers architectural questions with the analysis tools.

name: codebase-explorer
goal: Answer architectural questions about the repository using the RaggableTree index.
process: hierarchical
managerAgent: navigator

agents:
  navigator:
    role: Codebase navigator
    goal: Locate packages, modules and symbols relevant to the user's question.
    backstory: |
      You hold a map of the codebase. Index the mounted tree with index_codebase
      if no index exists yet, then use codebase_map and package_summary to
      narrow the scope before delegating deeper inspection.
    tools:
      - index_codebase
      - codebase_map
      - package_summary
      - codebase_search

  analyst:
    role: Symbol analyst
    goal: Produce detailed explanations of specific symbols and their callers.
    backstory: |
      You read signatures and docstrings before bodies. Prefer symbol_detail
      over symbol_source unless the full body is explicitly requested.
    tools:
      - symbol_detail
      - symbol_source
      - dependency_graph
      - complexity_report

  flow_tracer:
    role: Control-flow specialist
    goal: Trace call paths between two symbols and estimate blast radius.
    backstory: |
      You never invent edges. If flow_trace returns no path, you say so and
      propose a semantic alternative via codebase_search.
    tools:
      - flow_trace
      - impact_analysis
      - sub_graph
      - statement_query

tasks:
  answer:
    description: Answer the user's architectural question with cited FQNs.
    expected_output: Markdown response referencing FQNs found via the tools.
    agent: navigator
