name: twap_execution
description: >
  Executes large orders using Time-Weighted Average Price (TWAP) algorithm.
  Breaks orders into equal-sized slices at regular time intervals.
  Simple and predictable execution, ideal when volume patterns are uncertain.
parameters:
  symbol:
    type: string
    description: "Symbol to execute"
    required: true
  side:
    type: string
    description: "Order side: 'BUY' or 'SELL'"
    required: true
  quantity:
    type: number
    description: "Total quantity to execute"
    required: true
  start_time:
    type: string
    description: "Execution start time (HH:mm)"
    required: false
    default: "09:30"
  end_time:
    type: string
    description: "Execution end time (HH:mm)"
    required: false
    default: "16:00"
  slice_interval_minutes:
    type: integer
    description: "Time between slices in minutes (default: 5)"
    required: false
    default: 5
  randomize_timing:
    type: boolean
    description: "Randomize slice timing slightly to avoid detection (default: false)"
    required: false
    default: false
returns:
  timestamp: { type: string }
  algorithm: { type: string }
  symbol: { type: string }
  side: { type: string }
  total_quantity: { type: number }
  start_time: { type: string }
  end_time: { type: string }
  total_slices: { type: integer }
  slice_interval_minutes: { type: integer }
  quantity_per_slice: { type: number }
  randomized_timing: { type: boolean }
  execution_schedule: { type: array }
  estimated_completion: { type: string }
  execution_strategy: { type: object }
