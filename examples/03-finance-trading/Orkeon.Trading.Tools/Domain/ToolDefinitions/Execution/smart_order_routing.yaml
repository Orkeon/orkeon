name: smart_order_routing
description: >
  Routes orders across multiple trading venues to optimize execution quality.
  Considers liquidity, fees, rebates, latency, and historical fill rates.
  Dynamically splits orders across venues for best execution.
parameters:
  symbol:
    type: string
    description: "Symbol to route"
    required: true
  side:
    type: string
    description: "Order side: 'BUY' or 'SELL'"
    required: true
  quantity:
    type: number
    description: "Total quantity to route"
    required: true
  order_type:
    type: string
    description: "Order type: 'MARKET', 'LIMIT', 'IOC', 'FOK'"
    required: false
    default: "LIMIT"
  limit_price:
    type: number
    description: "Limit price (required for LIMIT orders)"
    required: false
  optimization_objective:
    type: string
    description: "Objective: 'best_price', 'best_speed', 'best_fill_rate', 'lowest_cost'"
    required: false
    default: "best_price"
  available_venues:
    type: array
    description: "Available trading venues (optional, uses all if not specified)"
    required: false
returns:
  timestamp: { type: string }
  algorithm: { type: string }
  symbol: { type: string }
  side: { type: string }
  total_quantity: { type: number }
  order_type: { type: string }
  optimization_objective: { type: string }
  total_venues: { type: integer }
  routing_plan: { type: array }
  expected_costs: { type: object }
  execution_strategy: { type: object }
