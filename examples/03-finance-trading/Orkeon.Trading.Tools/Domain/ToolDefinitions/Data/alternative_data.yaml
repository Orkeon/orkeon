name: alternative_data
description: >
  Fetches alternative data including news sentiment, social media sentiment,
  analyst ratings, and other non-traditional market signals.
  Useful for gauging market sentiment and identifying potential catalysts.
parameters:
  symbol:
    type: string
    description: "The stock symbol (e.g., 'AAPL')"
    required: true
  data_types:
    type: array
    description: "Types of alternative data to fetch: ['news', 'social', 'analyst', 'all']"
    required: false
    default: ["all"]
  lookback_days:
    type: integer
    description: "Number of days to look back for data (default: 7, max: 90)"
    required: false
    default: 7
  aggregate:
    type: boolean
    description: "Whether to aggregate sentiment into overall score"
    required: false
    default: true
returns:
  symbol: { type: string }
  timestamp: { type: string }
  lookback_days: { type: integer }
  data_sources: { type: array }
  sentiment_data: { type: array }
  total_signals: { type: integer }
  aggregated_sentiment: { type: object }
  metadata: { type: object }
