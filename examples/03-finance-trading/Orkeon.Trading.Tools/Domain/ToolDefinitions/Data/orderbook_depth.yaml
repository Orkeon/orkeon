name: orderbook_depth
description: >
  Fetches order book depth (Level 2 market data) for specified symbols.
  Returns bid/ask price levels with volumes for liquidity analysis and market microstructure studies.
parameters:
  symbol:
    type: string
    description: "The stock symbol (e.g., 'AAPL')"
    required: true
  depth:
    type: integer
    description: "Number of price levels to fetch (default: 10, max: 100)"
    required: false
    default: 10
  calculate_imbalance:
    type: boolean
    description: "Whether to calculate order book imbalance metrics"
    required: false
    default: true
returns:
  symbol: { type: string }
  timestamp: { type: string }
  bids: { type: array }
  asks: { type: array }
  spread: { type: number }
  spread_bps: { type: number }
  mid_price: { type: number }
  total_bid_volume: { type: number }
  total_ask_volume: { type: number }
  bid_levels: { type: integer }
  ask_levels: { type: integer }
  imbalance: { type: object }
