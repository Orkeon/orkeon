name: historical_data_fetch
description: >
  Fetches historical OHLCV data efficiently with automatic caching.
  Supports multiple symbols and timeframes. Data is cached in Redis
  with adaptive TTL based on data age and volatility.
parameters:
  symbols:
    type: array
    description: "Array of stock symbols (e.g., ['AAPL', 'MSFT', 'GOOGL'])"
    required: true
  start_date:
    type: string
    description: "Start date in ISO 8601 format (e.g., '2024-01-01')"
    required: true
  end_date:
    type: string
    description: "End date in ISO 8601 format (e.g., '2024-12-31')"
    required: true
  timeframe:
    type: string
    description: "Data timeframe: '1d' (daily), '1h' (hourly), '5m' (5-minute)"
    required: false
    default: "1d"
  use_cache:
    type: boolean
    description: "Whether to use Redis cache"
    required: false
    default: true
  cache_ttl_hours:
    type: integer
    description: "Cache TTL in hours (0 = adaptive based on data age)"
    required: false
    default: 0
returns:
  data: { type: object }
  total_symbols: { type: integer }
  successful_symbols: { type: integer }
  failed_symbols: { type: integer }
  cache_hits: { type: integer }
  cache_misses: { type: integer }
  total_latency_ms: { type: number }
  average_latency_per_symbol_ms: { type: number }
  timeframe: { type: string }
  errors: { type: array }
