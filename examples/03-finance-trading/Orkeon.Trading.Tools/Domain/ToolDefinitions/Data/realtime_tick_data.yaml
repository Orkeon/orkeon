name: realtime_tick_data
description: >
  Streams real-time tick-level trade data for specified symbols.
  Returns tick-by-tick trades with price, volume, side, and timestamp.
  Useful for high-frequency analysis and microstructure studies.
parameters:
  symbol:
    type: string
    description: "The stock symbol to stream (e.g., 'AAPL')"
    required: true
  duration_seconds:
    type: integer
    description: "Duration to collect ticks in seconds (max 300)"
    required: false
    default: 60
  max_ticks:
    type: integer
    description: "Maximum number of ticks to collect (max 10000)"
    required: false
    default: 1000
  aggregate:
    type: boolean
    description: "Whether to aggregate ticks into summary statistics"
    required: false
    default: false
returns:
  symbol: { type: string }
  ticks: { type: array }
  total_ticks: { type: integer }
  start_time: { type: string }
  end_time: { type: string }
  duration_ms: { type: number }
  average_tps: { type: number }
  summary: { type: object }
