name: black_litterman
description: >
  Performs Black-Litterman portfolio optimization combining market equilibrium with investor views.
  Blends market-implied expected returns with subjective forecasts using Bayesian approach.
  Produces stable, diversified portfolios with explicit confidence levels for views.
parameters:
  symbols:
    type: array
    description: "Array of symbols (e.g., ['AAPL', 'MSFT', 'GOOGL'])"
    required: true
  returns_data:
    type: object
    description: "Dictionary of symbol -> historical returns array"
    required: true
  market_caps:
    type: object
    description: "Dictionary of symbol -> market capitalization (for equilibrium weights)"
    required: true
  investor_views:
    type: array
    description: "Array of investor views: [{type: 'absolute/relative', assets: ['AAPL'], return: 0.15, confidence: 0.7}]"
    required: false
  risk_aversion:
    type: number
    description: "Market risk aversion parameter"
    required: false
    default: 2.5
  tau:
    type: number
    description: "Uncertainty scaling parameter"
    required: false
    default: 0.05
  risk_free_rate:
    type: number
    description: "Risk-free rate"
    required: false
    default: 0.02
returns:
  timestamp: { type: string }
  method: { type: string }
  description: { type: string }
  symbols: { type: array }
  optimal_weights: { type: object }
  expected_return: { type: number }
  expected_volatility: { type: number }
  sharpe_ratio: { type: number }
  implied_returns: { type: object }
  posterior_returns: { type: object }
  return_adjustments: { type: object }
  investor_views: { type: array }
