name: mean_variance_optimization
description: >
  Performs Mean-Variance Optimization using Markowitz Modern Portfolio Theory.
  Constructs efficient frontier, finds maximum Sharpe ratio portfolio, minimum variance portfolio.
  Supports constraints: long-only, weight bounds, sector limits, turnover constraints.
parameters:
  symbols:
    type: array
    description: "Array of symbols to optimize (e.g., ['AAPL', 'MSFT', 'GOOGL'])"
    required: true
  returns_data:
    type: object
    description: "Dictionary of symbol -> historical returns array"
    required: true
  risk_free_rate:
    type: number
    description: "Risk-free rate for Sharpe ratio calculation (default: 0.02 = 2%)"
    required: false
    default: 0.02
  target_return:
    type: number
    description: "Target return for efficient portfolio (optional)"
    required: false
  target_volatility:
    type: number
    description: "Target volatility for efficient portfolio (optional)"
    required: false
  min_weight:
    type: number
    description: "Minimum weight per asset (default: 0 for long-only)"
    required: false
    default: 0.0
  max_weight:
    type: number
    description: "Maximum weight per asset"
    required: false
    default: 1.0
  current_weights:
    type: object
    description: "Current portfolio weights for turnover constraint"
    required: false
  max_turnover:
    type: number
    description: "Maximum portfolio turnover (optional)"
    required: false
returns:
  timestamp: { type: string }
  method: { type: string }
  symbols: { type: array }
  optimal_weights: { type: object }
  expected_return: { type: number }
  expected_volatility: { type: number }
  sharpe_ratio: { type: number }
  risk_free_rate: { type: number }
  alternative_portfolios: { type: object }
  efficient_frontier: { type: array }
  diversification_metrics: { type: object }
  constraints_applied: { type: array }
