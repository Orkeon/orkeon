name: risk_parity
description: >
  Constructs Risk Parity portfolio where each asset contributes equally to portfolio risk.
  Allocates more to low-volatility assets, less to high-volatility assets.
  Produces well-diversified portfolios suitable for all-weather strategies.
parameters:
  symbols:
    type: array
    description: "Array of symbols (e.g., ['SPY', 'TLT', 'GLD', 'DBC'])"
    required: true
  returns_data:
    type: object
    description: "Dictionary of symbol -> historical returns array"
    required: true
  target_risk_contributions:
    type: object
    description: "Optional: Dictionary of symbol -> target risk contribution (must sum to 1.0)"
    required: false
  risk_free_rate:
    type: number
    description: "Risk-free rate"
    required: false
    default: 0.02
returns:
  timestamp: { type: string }
  method: { type: string }
  symbols: { type: array }
  optimal_weights: { type: object }
  risk_contributions: { type: object }
  target_risk_contributions: { type: object }
  marginal_risk_contributions: { type: object }
  expected_return: { type: number }
  expected_volatility: { type: number }
  sharpe_ratio: { type: number }
  diversification_ratio: { type: number }
  risk_balance_score: { type: number }
