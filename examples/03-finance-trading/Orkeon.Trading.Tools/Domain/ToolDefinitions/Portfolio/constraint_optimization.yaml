name: constraint_optimization
description: >
  Performs portfolio optimization with complex real-world constraints.
  Supports: sector limits, ESG scores, liquidity requirements, tracking error, turnover, position limits.
  Produces institutional-grade portfolios satisfying regulatory and investment policy requirements.
parameters:
  symbols:
    type: array
    description: "Array of symbols"
    required: true
  returns_data:
    type: object
    description: "Dictionary of symbol -> historical returns array"
    required: true
  constraints:
    type: object
    description: "Constraint definitions (sector_limits, esg_min, max_weight, min_weight, etc.)"
    required: true
  asset_metadata:
    type: object
    description: "Dictionary of symbol -> metadata (sector, esg_score, liquidity, market_cap)"
    required: false
  benchmark_weights:
    type: object
    description: "Benchmark weights for tracking error constraint"
    required: false
  current_weights:
    type: object
    description: "Current portfolio weights for turnover constraint"
    required: false
  optimization_objective:
    type: string
    description: "Objective: 'maximize_sharpe', 'minimize_variance', 'maximize_return', 'minimize_tracking_error'"
    required: false
    default: "maximize_sharpe"
returns:
  timestamp: { type: string }
  method: { type: string }
  objective: { type: string }
  symbols: { type: array }
  optimal_weights: { type: object }
  expected_return: { type: number }
  expected_volatility: { type: number }
  sharpe_ratio: { type: number }
  constraints_applied: { type: array }
  constraints_satisfied: { type: object }
  tracking_error: { type: number }
  portfolio_turnover: { type: number }
