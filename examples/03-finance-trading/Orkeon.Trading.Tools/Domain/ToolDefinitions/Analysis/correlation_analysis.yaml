name: correlation_analysis
description: >
  Analyzes correlations between multiple assets, calculates correlation matrix,
  beta against benchmark, and provides diversification metrics.
  Essential for portfolio construction and risk management.
parameters:
  symbols:
    type: array
    description: "Array of symbols to analyze (e.g., ['AAPL', 'MSFT', 'GOOGL'])"
    required: true
  price_data:
    type: object
    description: "Dictionary of symbol -> price data arrays"
    required: true
  benchmark_symbol:
    type: string
    description: "Benchmark symbol for beta calculation (e.g., 'SPY')"
    required: false
    default: "SPY"
  lookback_days:
    type: integer
    description: "Number of days to use for correlation calculation"
    required: false
    default: 252
returns:
  timestamp: { type: string }
  symbols: { type: array }
  lookback_days: { type: integer }
  correlation_matrix: { type: object }
  beta_values: { type: object }
  benchmark_symbol: { type: string }
  diversification_metrics: { type: object }
  correlation_clusters: { type: array }
