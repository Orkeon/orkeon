name: multi_asset_comparison
description: >
  Performs comparative analysis across multiple assets.
  Compares performance, volatility, risk-adjusted returns, correlations, and rankings.
  Useful for relative value analysis and asset selection.
parameters:
  symbols:
    type: array
    description: "Array of symbols to compare (e.g., ['AAPL', 'MSFT', 'GOOGL', 'AMZN'])"
    required: true
  price_data:
    type: object
    description: "Dictionary of symbol -> price data arrays"
    required: true
  comparison_period:
    type: string
    description: "Period for comparison: '1M', '3M', '6M', '1Y', 'YTD', 'ALL'"
    required: false
    default: "1Y"
  metrics:
    type: array
    description: "Metrics to compare: ['return', 'volatility', 'sharpe', 'max_dd', 'all']"
    required: false
    default: ["all"]
returns:
  timestamp: { type: string }
  symbols: { type: array }
  comparison_period: { type: string }
  comparison_table: { type: object }
  rankings: { type: object }
  best_performers: { type: object }
  correlation_matrix: { type: object }
  summary_statistics: { type: object }
