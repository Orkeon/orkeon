name: pattern_recognition
description: >
  Detects technical chart patterns including candlestick patterns (doji, hammer, engulfing),
  chart patterns (head and shoulders, triangles, flags), and price action setups.
  Returns detected patterns with confidence scores and trading implications.
parameters:
  symbol:
    type: string
    description: "The stock symbol (e.g., 'AAPL')"
    required: true
  price_data:
    type: array
    description: "Array of OHLCV data points (minimum 50 recommended)"
    required: true
  pattern_types:
    type: array
    description: "Pattern types to detect: ['candlestick', 'chart', 'all']"
    required: false
    default: ["all"]
  min_confidence:
    type: number
    description: "Minimum confidence threshold (0-1)"
    required: false
    default: 0.6
returns:
  symbol: { type: string }
  timestamp: { type: string }
  patterns: { type: array }
  total_patterns: { type: integer }
  pattern_summary: { type: object }
  primary_pattern: { type: object }
