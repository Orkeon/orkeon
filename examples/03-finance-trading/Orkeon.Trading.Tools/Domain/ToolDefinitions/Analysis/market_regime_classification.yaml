name: market_regime_classification
description: >
  Classifies current market regime into states: trending bullish, trending bearish,
  ranging/sideways, or highly volatile. Uses volatility, trend strength, and price action analysis.
parameters:
  symbol:
    type: string
    description: "The stock symbol (e.g., 'SPY')"
    required: true
  price_data:
    type: array
    description: "Array of OHLCV data points (minimum 50 recommended)"
    required: true
  lookback_days:
    type: integer
    description: "Number of days to analyze for regime classification"
    required: false
    default: 60
returns:
  symbol: { type: string }
  timestamp: { type: string }
  current_regime: { type: string }
  confidence: { type: number }
  regime_probabilities: { type: object }
  metrics: { type: object }
  characteristics: { type: array }
  trading_implications: { type: array }
