name: transaction_cost_analysis
description: >
  Analyzes transaction costs including commissions, slippage, and market impact.
parameters:
  trades:
    type: array
    description: "Executed trades"
    required: true
returns:
  timestamp: { type: string }
  trades_analyzed: { type: integer }
  total_commission: { type: number }
  total_slippage: { type: number }
  total_cost: { type: number }
  average_cost_bps: { type: number }
  trade_costs: { type: array }
