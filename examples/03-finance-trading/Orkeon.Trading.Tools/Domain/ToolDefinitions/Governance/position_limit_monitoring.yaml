name: position_limit_monitoring
description: >
  Monitors position sizes against regulatory and internal limits.
parameters:
  positions:
    type: object
    description: "Current positions"
    required: true
  limits:
    type: object
    description: "Position limits"
    required: true
returns:
  timestamp: { type: string }
  positions_monitored: { type: integer }
  limit_breaches: { type: integer }
  warnings: { type: array }
  status: { type: string }
