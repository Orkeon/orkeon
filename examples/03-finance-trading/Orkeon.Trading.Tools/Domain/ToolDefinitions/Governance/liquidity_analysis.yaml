name: liquidity_analysis
description: >
  Analyzes portfolio liquidity and estimates time-to-liquidate.
parameters:
  positions:
    type: array
    description: "Portfolio positions with volume data"
    required: true
returns:
  timestamp: { type: string }
  portfolio_liquidity_score: { type: number }
  max_days_to_liquidate: { type: number }
  position_liquidity: { type: array }
  liquidity_rating: { type: string }
  illiquid_positions: { type: integer }
