name: alert_management
description: >
  Manages trading alerts and notifications for critical events.
parameters:
  alert_type:
    type: string
    description: "Alert type: 'RISK', 'COMPLIANCE', 'SYSTEM', 'MARKET'"
    required: true
  severity:
    type: string
    description: "Severity: 'INFO', 'WARNING', 'CRITICAL'"
    required: true
  message:
    type: string
    description: "Alert message"
    required: true
returns:
  alert_created: { type: boolean }
  alert_id: { type: string }
  notification_sent: { type: boolean }
  channels: { type: array }
