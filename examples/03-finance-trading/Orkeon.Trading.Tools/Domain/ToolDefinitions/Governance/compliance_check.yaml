name: compliance_check
description: >
  Validates trades against regulatory and internal compliance rules.
parameters:
  trade:
    type: object
    description: "Proposed trade"
    required: true
  rules:
    type: array
    description: "Compliance rules"
    required: true
returns:
  timestamp: { type: string }
  trade_approved: { type: boolean }
  rules_checked: { type: integer }
  violations: { type: array }
  compliance_checks: { type: array }
  action: { type: string }
