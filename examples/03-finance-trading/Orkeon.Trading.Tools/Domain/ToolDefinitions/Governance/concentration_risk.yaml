name: concentration_risk
description: >
  Analyzes portfolio concentration risk across positions, sectors, and asset classes.
parameters:
  positions:
    type: array
    description: "Portfolio positions"
    required: true
returns:
  timestamp: { type: string }
  total_positions: { type: integer }
  herfindahl_index: { type: number }
  effective_positions: { type: number }
  top_5_concentration_pct: { type: number }
  max_single_position_pct: { type: number }
  concentration_rating: { type: string }
  diversification_score: { type: number }
