name: ensemble_prediction
description: >
  Combines multiple prediction models (ARIMA, Prophet, Random Forest, XGBoost) into ensemble forecast.
  Uses dynamic weighting based on historical accuracy and model confidence.
  Provides consensus prediction with improved robustness and accuracy.
parameters:
  symbol:
    type: string
    description: "The stock symbol (e.g., 'AAPL')"
    required: true
  price_data:
    type: array
    description: "Historical OHLCV data (minimum 100 data points recommended)"
    required: true
  forecast_periods:
    type: integer
    description: "Number of periods ahead to forecast"
    required: false
    default: 5
  models_to_include:
    type: array
    description: "Models to include: ['arima', 'prophet', 'random_forest', 'xgboost', 'all']"
    required: false
    default: ["all"]
  weighting_method:
    type: string
    description: "Weighting method: 'equal', 'performance', 'inverse_error'"
    required: false
    default: "performance"
returns:
  symbol: { type: string }
  timestamp: { type: string }
  weighting_method: { type: string }
  models_included: { type: array }
  ensemble_forecast: { type: array }
  individual_forecasts: { type: object }
  model_weights: { type: object }
  model_agreement: { type: number }
  current_price: { type: number }
  forecast_direction: { type: string }
  consensus_strength: { type: string }
