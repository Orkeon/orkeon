name: arima_prediction
description: >
  Performs ARIMA (AutoRegressive Integrated Moving Average) time series forecasting.
  Automatically determines optimal ARIMA(p,d,q) parameters using AIC/BIC criteria.
  Generates price predictions with confidence intervals. Best for trend-stationary data.
parameters:
  symbol:
    type: string
    description: "The stock symbol (e.g., 'AAPL')"
    required: true
  price_data:
    type: array
    description: "Historical price data (minimum 50 data points recommended)"
    required: true
  forecast_periods:
    type: integer
    description: "Number of periods ahead to forecast"
    required: false
    default: 5
  confidence_level:
    type: number
    description: "Confidence level for prediction intervals (e.g., 0.95 for 95%)"
    required: false
    default: 0.95
  auto_params:
    type: boolean
    description: "Automatically determine optimal ARIMA(p,d,q) parameters"
    required: false
    default: true
  p:
    type: integer
    description: "AR order (if auto_params is false)"
    required: false
    default: 1
  d:
    type: integer
    description: "Differencing order (if auto_params is false)"
    required: false
    default: 1
  q:
    type: integer
    description: "MA order (if auto_params is false)"
    required: false
    default: 1
returns:
  symbol: { type: string }
  timestamp: { type: string }
  model_parameters: { type: object }
  forecast: { type: array }
  model_diagnostics: { type: object }
  current_price: { type: number }
  forecast_direction: { type: string }
  forecast_change_pct: { type: number }
