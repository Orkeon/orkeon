name: xgboost_prediction
description: >
  Performs price prediction using XGBoost (Extreme Gradient Boosting) algorithm.
  Uses gradient boosting with L1/L2 regularization to prevent overfitting.
  Excels at capturing non-linear patterns and provides feature importance rankings.
parameters:
  symbol:
    type: string
    description: "The stock symbol (e.g., 'AAPL')"
    required: true
  price_data:
    type: array
    description: "Historical OHLCV data (minimum 100 data points recommended)"
    required: true
  forecast_periods:
    type: integer
    description: "Number of periods ahead to forecast"
    required: false
    default: 5
  n_estimators:
    type: integer
    description: "Number of boosting rounds"
    required: false
    default: 100
  learning_rate:
    type: number
    description: "Learning rate / eta"
    required: false
    default: 0.1
  max_depth:
    type: integer
    description: "Maximum tree depth"
    required: false
    default: 6
  feature_set:
    type: string
    description: "Feature set: 'basic', 'technical', 'comprehensive'"
    required: false
    default: "comprehensive"
returns:
  symbol: { type: string }
  timestamp: { type: string }
  model_config: { type: object }
  forecast: { type: array }
  feature_importance: { type: object }
  model_metrics: { type: object }
  current_price: { type: number }
  forecast_direction: { type: string }
  confidence: { type: number }
