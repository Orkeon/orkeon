# 84. Critique Multi-Perspectives — Independence Garantie
# Use case: Multi-perspective literary critique with guaranteed independence through parallel batch execution
# Source: project/marketing/content-strategy/101-USE-CASES.md #84

name: "multi-perspective-critique"
goal: "Produce multi-perspective critique of creative works with guaranteed independence through parallel execution"
process: "parallel"
verbose: true
memory: false
planning: false

agents:
  structuralist_critic:
    role: "Structuralist Critic"
    goal: "Analyze the work through structuralist literary theory"
    backstory: |
      You are a literary critic grounded in structuralism. You analyze
      narrative structures, binary oppositions, underlying codes, and
      the systematic relationships between elements. You draw on
      Saussure, Barthes, and Levi-Strauss.
    tools:
      - "file_read"
      - "json_tool"
    allowDelegation: false
    maxIter: 10
    verbose: true

  feminist_critic:
    role: "Feminist Critic"
    goal: "Analyze the work through feminist critical theory"
    backstory: |
      You are a feminist literary critic who examines gender representation,
      power dynamics, narrative voice, and the construction of femininity
      and masculinity. You draw on Beauvoir, Butler, Cixous, and hooks
      to illuminate gendered dimensions of the text.
    tools:
      - "file_read"
      - "json_tool"
    allowDelegation: false
    maxIter: 10
    verbose: true

  postcolonial_critic:
    role: "Post-Colonial Critic"
    goal: "Analyze the work through post-colonial critical theory"
    backstory: |
      You are a post-colonial literary critic who examines representations
      of otherness, colonial legacies, cultural hybridity, and power
      relations between center and periphery. You draw on Said, Spivak,
      Bhabha, and Fanon.
    tools:
      - "file_read"
      - "web_scrape"
      - "json_tool"
    allowDelegation: false
    maxIter: 10
    verbose: true

  comparative_synthesizer:
    role: "Comparative Synthesizer"
    goal: "Synthesize the independent critiques into a balanced multi-perspective analysis"
    backstory: |
      You are a comparative literature scholar who synthesizes multiple
      critical perspectives into a balanced analysis. You identify
      convergences, productive tensions, and unique insights from each
      approach without privileging any single perspective.
    tools:
      - "json_tool"
      - "file_write"
    allowDelegation: false
    maxIter: 10
    verbose: true

tasks:
  critique_structuralist:
    description: "Analyze the work through structuralist theory. Examine narrative structures, binary oppositions, codes, and systematic relationships. Cite theoretical frameworks."
    expectedOutput: "Structuralist critique with narrative analysis, identified structures, theoretical references, and key insights"
    agent: "structuralist_critic"
    dependencies: []
    asyncExecution: true
    humanInput: false

  critique_feminist:
    description: "Analyze the work through feminist theory. Examine gender representation, power dynamics, voice, and construction of identity. Cite theoretical frameworks."
    expectedOutput: "Feminist critique with gender analysis, power dynamics, representation assessment, and theoretical references"
    agent: "feminist_critic"
    dependencies: []
    asyncExecution: true
    humanInput: false

  critique_postcolonial:
    description: "Analyze the work through post-colonial theory. Examine representations of otherness, colonial legacies, cultural hybridity, and center-periphery relations."
    expectedOutput: "Post-colonial critique with otherness analysis, colonial legacy assessment, and theoretical references"
    agent: "postcolonial_critic"
    dependencies: []
    asyncExecution: true
    humanInput: false

  synthesize_perspectives:
    description: "Synthesize all three independent critiques into a balanced multi-perspective analysis. Identify convergences, tensions, and unique contributions of each approach."
    expectedOutput: "Comparative synthesis with cross-perspective analysis, convergences, productive tensions, and overall assessment"
    agent: "comparative_synthesizer"
    dependencies:
      - "critique_structuralist"
      - "critique_feminist"
      - "critique_postcolonial"
    asyncExecution: false
    humanInput: false
