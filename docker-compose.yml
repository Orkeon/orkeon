version: '3.8'

services:
  orkeon-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data

  ollama:
    # Pinned, not :latest - dependabot's docker ecosystem (declared for / and /deploy)
    # can only propose an upgrade against a concrete tag, and a local model server that
    # changes under the developer is a debugging trap.
    image: ollama/ollama:0.33.3
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
